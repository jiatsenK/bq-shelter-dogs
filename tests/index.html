<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<!-- 舊網址轉址（#129）：GitHub Pages 不能設伺服器轉址，舊網址 jiatsenk.github.io 一打開就換到新網址同一頁（含 # 分類）；新網址、預覽版、本機不受影響 -->
<script>if (location.hostname === 'jiatsenk.github.io') location.replace('https://bq-shelter-dogs.<子網域>.workers.dev' + location.pathname.replace(/^\/bq-shelter-dogs(?=\/|$)/, '') + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>板收志工溜狗表：資料讀取測試</title>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 16px; background: #EEF4FB; color: #1E2A44; }
  h1 { font-size: 20px; }
  #summary { font-size: 18px; font-weight: 700; margin: 12px 0; }
  .pass { color: #2E8B45; } .fail { color: #D93036; }
  li { margin: 4px 0; line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>板收志工溜狗表：資料讀取測試</h1>
<p>這頁只用假資料檢查 js/app.js 的讀取與畫面（另外會讀 repo 裡的 data/dogs.json 檢查格式）。試算表解析與狗卡資訊（dogs/*.md）整理的測試在 scripts/sync-sheet.test.mjs。</p>
<div id="summary">測試中…</div>
<ol id="results"></ol>

<!-- js/app.js 在載入時會用到這幾個元素 -->
<div class="hidden">
  <input id="searchInput"><button id="searchClear" hidden></button><div id="tabs"></div><main id="main"></main>
  <span id="dateLabel"></span><span id="updatedLabel"></span><button id="analysisBack" class="head-back"></button>
  <div id="detailBackdrop" hidden><div id="detail"></div></div>
</div>

<script>
window.__BQ_TEST__ = true;
const results = [];
function check(name, fn) {
  return Promise.resolve().then(fn).then(
    () => results.push({ name, ok: true }),
    e => results.push({ name, ok: false, msg: e && e.message ? e.message : String(e) }));
}
function eq(actual, expected, label = '') {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error(`${label}預期 ${b}，實際 ${a}`);
}
const ymd = d => d ? `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` : null;

const TODAY = new Date(2026, 8, 24, 10);
// #35 測試用的假 localStorage：測試頁跟網站同網域，不能動到志工手機上真正的「今天已溜」
function fakeStorage() {
  const data = {};
  return { getItem: k => (k in data ? data[k] : null), setItem: (k, v) => { data[k] = String(v); }, removeItem: k => { delete data[k]; } };
}
let INDEX_HTML = ''; // index.html 原始碼，#10 唯讀檢查用（其他測試會替換 fetch，所以先存下來）
let APP_JS = '';     // js/app.js 原始碼（#30 拆檔後程式在這裡）
let ANALYSIS_JS = ''; // js/analysis.js 原始碼（#59 分析頁）
let FIND_JS = '';     // js/find.js 原始碼（#99 找狗）
let SITE_JS = '';     // js/site-config.js 原始碼（這間收容所的設定）
let MANIFEST = {};    // manifest.webmanifest，#33 主畫面名稱檢查用
let DOGS_JSON = null; // data/dogs.json，#32 格式檢查用

function runTests() {
  return Promise.all([
    check('未來日期顯示「日期看不懂」，不顯示負的天數', () => {
      const badge = statusBadge({ name: 'x', walkedDate: new Date(2099, 0, 1), covered: false, note: '' }, TODAY);
      if (!badge.includes('日期看不懂') || badge.includes('-')) throw new Error(`標籤是 ${badge}`);
    }),
    check('勿溜：異體字也算，住院不算', () => {
      eq(specialFlag('勿遛，散步時勿溜太久'), { keywords: ['勿溜'], terms: ['勿溜', '勿遛'] });
      eq(specialFlag('住院區，胸背帶放住院'), null);
      eq(specialFlag('親人，好牽'), null);
      eq(specialFlag(''), null);
    }),
    check('勿溜：備註裡每個命中的字眼都標出來，其他文字照樣跳脫', () => {
      const note = '勿溜<先問>，下午再勿遛';
      eq(highlightNote(note, specialFlag(note).terms), '<mark>勿溜</mark>&lt;先問&gt;，下午再<mark>勿遛</mark>');
    }),
    check('勿溜的狗仍留在溜狗表，卡片有天數和備註原文；沒有特殊狀況分頁', () => {
      allDogs = [
        { cage: '住院區', id: '1', name: '測試甲', walkedDate: new Date(), covered: false, note: '住院' },
        { cage: 'A02', id: '2', name: '測試乙', walkedDate: new Date(), covered: false, note: '' },
        { cage: 'A03', id: '3', name: '測試丙', walkedDate: new Date(), covered: false, note: '勿遛' },
      ];
      groupMap = { '測試丙': new Set(['測試乙']) };
      searchQuery = '';
      const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.textContent).sort();
      activeTab = 'walk'; renderMain(); eq(names(), ['測試甲', '測試乙', '測試丙'].sort(), '溜狗表：');
      const cards = [...document.querySelectorAll('#main .card')];
      const card = n => cards.find(c => c.querySelector('.name').textContent === n);
      if (card('測試甲').querySelector('.warn-note')) throw new Error('住院區的測試甲不該有警示');
      const hei = card('測試丙');
      if (!hei.querySelector('.warn-note') || !hei.querySelector('.last .val.sage')) throw new Error('測試丙要有天數和警示備註');
      eq(hei.querySelector('.warn-note .text').innerHTML, '<mark>勿遛</mark>', '備註：');
      if (hei.querySelector('.body > .warn-note') || !hei.querySelector(':scope > .warn-note')) throw new Error('警示備註要橫跨整張卡片，不可擠在照片右側');
      searchQuery = '測試丙'; renderMain();
      if (!document.querySelector('#main .card .warn-note')) throw new Error('搜尋結果沒有警示備註');
      searchQuery = '';
    }),
    // ── #9 照片與介紹 ──
    check('照片：有編號用 photos/thumbs/{編號}.jpg 縮圖（原圖放 data-full 備用）且延後載入；沒編號直接顯示腳掌、不抓 photos/.jpg', () => {
      const box = document.createElement('div');
      box.innerHTML = photoThumb({ name: '宙斯', id: '202101234' });
      const img = box.querySelector('img');
      eq(img.getAttribute('src'), 'photos/thumbs/202101234.jpg');
      eq(img.dataset.full, 'photos/202101234.jpg', '備用原圖：');
      eq(img.getAttribute('loading'), 'lazy');
      // #305：縮圖讀不到改用原圖時，框上標 thumb-full（顯示小圖示），讓 K 在正式畫面看得到哪張還沒縮圖
      img.onerror();
      eq(img.getAttribute('src'), 'photos/202101234.jpg');
      eq(img.parentNode.classList.contains('thumb-full'), true, '沒縮圖的標記：');
      eq(img.parentNode.classList.contains('no-photo'), false, '還有原圖可試：');
      box.innerHTML = photoThumb({ name: '金寶', id: '' });
      eq(box.querySelector('img'), null, '沒編號時的 img：');
      if (!box.querySelector('.thumb-fallback')) throw new Error('沒編號時沒有腳掌圖示');
    }),
    check('詳細資訊：dogs.json 有狗卡資訊才顯示，沒有就顯示提示', () => {
      const intro = dog => {
        const box = document.createElement('div');
        box.innerHTML = detailHtml(dog, TODAY);
        return box.querySelector('[data-section="intro"] .content');
      };
      eq(intro({ name: '宙斯', id: '202101234', cage: 'C03', walkedDate: null, covered: false, note: '', intro: '很親人' }).textContent, '很親人');
      eq(intro({ name: '比比', id: '202102346', cage: 'A08', walkedDate: null, covered: false, note: '', intro: '' }), null, '沒狗卡：');
    }),
    // ── #7 搜尋 ──
    check('搜尋：犬名部分符合即可，忽略空白、全形與大小寫', () => {
      const dog = { name: '測試 Lucky 丁' };
      eq(matchesSearch(dog, '試'), true);
      eq(matchesSearch(dog, 'lucky'), true, '大小寫：');
      eq(matchesSearch(dog, 'ＬＵＣＫＹ丁'), true, '全形、空白：');
      eq(matchesSearch(dog, '  '), true, '只有空白當作沒搜尋：');
      eq(matchesSearch(dog, '測試戊'), false);
    }),
    check('搜尋：只篩選目前分類，溜狗表數字跟著變、找狗不放數字，清空回到原本內容', () => {
      const daysAgo = n => new Date(Date.now() - n * 86400000);
      allDogs = [
        { cage: 'B01', id: '', name: '搜尋甲', walkedDate: daysAgo(1), covered: false, note: '' },
        { cage: 'B02', id: '', name: '搜尋乙', walkedDate: daysAgo(20), covered: false, note: '勿溜' },
        { cage: 'B02', id: '', name: '別隻丙', walkedDate: daysAgo(2), covered: false, note: '' },
      ];
      groupMap = {};
      const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.textContent);
      const counts = () => [...document.querySelectorAll('#tabs button .n')].map(n => n.textContent);
      const mainText = () => document.getElementById('main').textContent;
      try {
        searchQuery = '搜尋';
        activeTab = 'walk'; renderMain();
        eq(names(), ['搜尋乙', '搜尋甲'], '溜狗表（久沒遛的在前）：');
        eq(counts(), ['2', '', '', ''], '分類數字（找狗不放數字）：');
        if (!mainText().includes('搜尋「搜尋」：2 隻')) throw new Error('沒有顯示搜尋結果隻數');
        if (!document.querySelector('#main .card .warn-note')) throw new Error('勿溜的搜尋乙沒有警示備註');
        searchQuery = '<b>沒這隻'; activeTab = 'walk'; renderMain();
        eq(document.querySelector('#main .status-msg').innerHTML, '找不到「&lt;b&gt;沒這隻」');
        eq(counts(), ['0', '', '', ''], '查無時分類數字：');
        searchQuery = ''; renderMain();
        eq(names().length, 3, '清空後：');
        eq(counts(), ['3', '', '', ''], '清空後分類數字：');
      } finally { searchQuery = ''; activeTab = 'walk'; }
    }),
    check('搜尋：輸入即篩選；注音選字途中不篩選，選好字才更新', () => {
      allDogs = [{ cage: 'B01', id: '', name: '搜尋甲', walkedDate: null, covered: false, note: '' }];
      groupMap = {}; activeTab = 'walk';
      const input = document.getElementById('searchInput');
      try {
        input.value = 'ㄐ';
        input.dispatchEvent(new InputEvent('input', { isComposing: true }));
        eq(searchQuery, '', '選字途中：');
        input.value = '甲';
        input.dispatchEvent(new CompositionEvent('compositionend', { data: '甲' }));
        eq(searchQuery, '甲', '選好字：');
        eq(document.querySelectorAll('#main .card').length, 1);
        input.value = '';
        input.dispatchEvent(new InputEvent('input'));
        eq(searchQuery, '', '清空：');
      } finally { input.value = ''; searchQuery = ''; }
    }),
    check('#3 色標邊界（K 2026-10-09 改）：0～2 天綠、第 3 天起黃、第 5 天起紅', () => {
      const daysAgo = n => ({ name: '測試狗', walkedDate: new Date(2026, 8, 24 - n), covered: false });
      const level = n => computeStatus(daysAgo(n), TODAY).level;
      eq([0, 2, 3, 4, 5, 45].map(level), ['sage', 'sage', 'amber', 'amber', 'red', 'red']);
      const box = document.createElement('div');
      box.innerHTML = statusBadge(daysAgo(5), TODAY);
      eq(box.querySelector('.badge').className, 'badge red', '5 天徽章：');
      eq(box.querySelector('.badge').textContent, '5 天前', '5 天徽章文字：');
    }),
    check('#3 待巡房排序：沒紀錄最前，再由久到近，有人固定照顧最後；所有狗都在', () => {
      const d = (name, n, covered = false) => ({ name, walkedDate: n == null ? null : new Date(2026, 8, 24 - n), covered });
      const dogs = [d('甲', 3), d('乙', null, true), d('丙', 40), d('丁', null), d('戊', 0), d('己', 12)];
      eq(dueDogs(dogs, TODAY).map(x => x.name), ['丁', '丙', '己', '甲', '戊', '乙']);
    }),
    check('#10 唯讀：除搜尋框外沒有輸入框、勾選框、可編輯區塊；搜尋框有放大鏡與提示文字', () => {
      const doc = new DOMParser().parseFromString(INDEX_HTML, 'text/html');
      const inputs = [...doc.querySelectorAll('input, textarea, select, [contenteditable]')];
      eq(inputs.map(el => el.id), ['searchInput'], '可輸入元素：');
      const box = inputs[0];
      eq(box.type, 'search', '搜尋框型別：');
      eq(box.placeholder, '搜尋狗名', '提示文字：');
      if (!box.parentElement.querySelector('use[href="#i-search"]')) throw new Error('搜尋框旁要有放大鏡圖示');
      if (doc.querySelector('form')) throw new Error('頁面不應有表單');
      const symbols = [...doc.querySelectorAll('symbol')].map(el => el.id).join(' ');
      // #28 起卡片可以點開詳細資訊，所以允許右箭頭（chevron）；編輯、勾選圖示仍不行
      // （#35「今天已溜」的打勾圖示叫 i-tick，只記在這支手機，不是編輯試算表）
      if (/edit|pencil|pen|check/i.test(symbols)) throw new Error(`不應有編輯或勾選圖示：${symbols}`);
    }),
    check('#10 唯讀：網站不直接寫試算表；寫入都送到 Worker（照片，#138 起溜了經 Worker 的 /walk 寫遛狗日期和誰遛的）', () => {
      // #48 起唯一的寫入是把照片 POST 到 UPLOAD_URL（Cloudflare Worker），先把那一段拿掉再檢查其他地方
      const uploadCall = /fetch\(`\$\{UPLOAD_URL\}\/photos\/\$\{encodeURIComponent\(up\.dog\.id\)\}`, \{\s*method: 'POST',/;
      if (!uploadCall.test(APP_JS)) throw new Error('找不到照片上傳的呼叫');
      // #62 起「我的備註」PUT 到同一個 Worker 的 /notes/{編號}（寫進 Git，不是試算表），也先拿掉
      // V9（#141）拿掉我的備註，網站不再寫 /notes
      if (/\/notes/.test(APP_JS)) throw new Error('我的備註已拿掉，不該再讀寫 /notes');
      // #96 我是誰：名字 POST 到 /walker-code 換代號（不寫任何東西），也先拿掉
      const walkerCall = /fetch\(`\$\{UPLOAD_URL\}\/walker-code`, \{\s*method: 'POST',/;
      if (!walkerCall.test(APP_JS)) throw new Error('找不到換代號的呼叫');
      // 頁首「更新」：POST 到 /sync 請 Worker 叫 GitHub 同步（只讀試算表），也先拿掉
      const syncCall = /fetch\(`\$\{UPLOAD_URL\}\/sync`, \{ method: 'POST' \}\)/;
      if (!syncCall.test(APP_JS)) throw new Error('找不到更新的呼叫');
      // #138 按「溜了」：POST 到 /walk，由 Worker 轉給 K 部署的小程式寫試算表兩欄（網站本身不連 Google），也先拿掉；#281 加備註、異動紀錄也走 /walk
      const walkCall = /fetch\(`\$\{UPLOAD_URL\}\/walk`, \{ method: 'POST',/;
      if (!walkCall.test(APP_JS)) throw new Error('找不到寫入試算表的呼叫');
      // 休養中（K 2026-10-09）：管理者 PUT 到 Worker 的 /rest/{編號}（寫進 repo 的 data/rest.json，不是試算表），也先拿掉
      const restCall = /fetch\(`\$\{UPLOAD_URL\}\/rest\/\$\{encodeURIComponent\(e\.dog\.id\)\}`, \{\s*method: 'PUT',/;
      if (!restCall.test(APP_JS)) throw new Error('找不到休養設定的呼叫');
      // 入所介紹（K 2026-10-10 補資料）：管理者 PUT 到 Worker 的 /intro/{編號}（寫進 repo 的 dogs/{編號}.md，不是試算表），也先拿掉
      const introCall = /fetch\(`\$\{UPLOAD_URL\}\/intro\/\$\{encodeURIComponent\(e\.dog\.id\)\}`, \{\s*method: 'PUT',/;
      if (!introCall.test(APP_JS)) throw new Error('找不到入所介紹的呼叫');
      // 舊編號（#289）：誰都能 POST／DELETE 到 Worker 的 /former/{編號}（存 D1，不是試算表），也先拿掉
      const formerCall = /fetch\(`\$\{UPLOAD_URL\}\/former\/\$\{encodeURIComponent\(dog\.id\)\}`, \{\s*method, /;
      if (!formerCall.test(APP_JS)) throw new Error('找不到舊編號的呼叫');
      const staysCall = /fetch\(`\$\{UPLOAD_URL\}\/stays\/\$\{encodeURIComponent\(e\.dog\.id\)\}`, \{\s*method: 'PUT', /;
      if (!staysCall.test(APP_JS)) throw new Error('找不到出入所紀錄的呼叫');
      const favoriteCall = /async function favoriteRequest\(codes, op\) \{[\s\S]*?\n\}\r?\n\r?\nfunction syncFavs/;
      if (!favoriteCall.test(APP_JS) || !APP_JS.includes("const base = UPLOAD_URL + '/favorites'")) throw new Error('找不到常溜的 Worker 呼叫');
      const identityCall = /async function identityRequest\(action, body\) \{[\s\S]*?\n\}/;
      const code = APP_JS.replace(identityCall, '').replace(favoriteCall, '').replace(new RegExp(walkCall.source, 'g'), '').replace(uploadCall, '').replace(walkerCall, '').replace(syncCall, '').replace(restCall, '').replace(introCall, '').replace(formerCall, '').replace(staysCall, '').replace("sendFormer(e.dog, former, 'POST')", '').replace("sendFormer(dog, former, 'DELETE')", '');
      const bad = [/method\s*:/i, /\bPOST\b|\bPUT\b|\bPATCH\b|\bDELETE\b/, /script\.google\.com|macros\/s\//, /sheets\.googleapis\.com/,
        /appendRow|setValue|batchUpdate|XMLHttpRequest|sendBeacon|indexedDB|sessionStorage|document\.cookie/];
      const hits = bad.filter(re => re.test(code)).map(String);
      eq(hits, [], '寫入相關字眼：');
      // #48 GitHub 寫入權限只在 Worker：網站程式不能有 token 或直接連 GitHub API
      const tokenHits = [/ghp_|gho_|github_pat_/, /api\.github\.com/, /Authorization|Bearer/i, /GITHUB_TOKEN/].filter(re => re.test(APP_JS)).map(String);
      eq(tokenHits, [], 'GitHub 憑證相關字眼：');
      // #35 起「今天已溜」存在這支手機的 localStorage，只准用 WALKED_KEY；通關碼 ADR 0004 拿掉了
      eq([...code.matchAll(/\blocalStorage\s*[.[]|window\.localStorage/g)].length, 1, 'localStorage 只在一個地方取用：');
      eq([...code.matchAll(/\.(setItem|getItem|removeItem)\(([^,)]*)/g)].map(m => m[2]), ['WALKER_CODES_KEY', 'WALKER_CODES_KEY', 'WALKER_CODES_KEY', 'WALKED_KEY', 'WALKED_KEY', 'WALKER_CODES_KEY', 'key', 'key', 'WALKER_NAME_KEY', 'WALKER_NAME_KEY', 'WALKER_NAME_KEY', 'SHEET_WRITES_KEY', 'SHEET_WRITES_KEY', 'WALK_VIEW_KEY', 'WALK_VIEW_KEY', 'ONBOARD_KEY', 'ONBOARD_KEY', 'NAME_LATER_KEY', 'NAME_LATER_KEY', 'NAME_LATER_KEY'], '只讀寫 WALKER_CODES_KEY（#96 我是誰）、WALKED_KEY、WALKER_NAME_KEY 和 SHEET_WRITES_KEY（#138 寫試算表）、WALK_VIEW_KEY、ONBOARD_KEY（V9）、NAME_LATER_KEY（先看看，介面評估第四輪），key 是一起溜的人（readJsonKey／writeJsonKey）：');
      if (!/readJsonKey\(COMPANIONS_KEY\)/.test(APP_JS) || !/writeJsonKey\(WALK_WITH_KEY,/.test(APP_JS)) throw new Error('readJsonKey／writeJsonKey 只給一起溜的人用');
      const urls = [...code.matchAll(/fetch\(([^)]*)\)/g)].map(m => m[1].trim());
      eq(urls.length, 6, 'fetch 呼叫數（上傳以外）：');
      // #32 起前端只讀 data/dogs.json，不直接連試算表；狗卡資訊也已經寫在 dogs.json 裡，不再抓 dogs/*.md
      // #62 另外讀我的備註：只從 Worker 的 /notes 或網站上的 data/my-notes.json 讀
      // #58 我最近溜過另外讀溜狗紀錄（#260 起是 api/walks）；ADR 0007 今日溜狗紀錄讀 api/today
      if (!urls.every(u => u.startsWith('DATA_URL,') || u.startsWith('WALKS_URL,') || u.startsWith('`${WALKS_URL}?year=') || u.startsWith('REST_URL,') || u === "`${UPLOAD_URL}/walkers`, { cache: 'no-cache' }" || u === "`${UPLOAD_URL}/today`, { cache: 'no-cache' }")) throw new Error(`只能讀 api/dogs、api/walks 與我的備註：${urls.join('、')}`);
      if (/readJsonObject|GALLERY_URL|\/gallery/.test(APP_JS)) throw new Error('相簿已拿掉（K 2026-10-09），不該再讀相簿清單');
      eq(DATA_URL, 'api/dogs', '資料來源（#247 Worker 讀 D1）：');
      eq(WALKS_URL, 'api/walks', '遛狗紀錄（#260 Worker 讀 D1）：');
      eq(REST_URL, 'api/rest', '休養設定（#250 Worker 讀 D1）：');
      if (/docs\.google\.com|gviz/.test(APP_JS)) throw new Error('前端不應再連 Google 試算表');
    }),

// 會替換 fetch、呼叫 init 的測試一項一項跑，才不會跟其他測試互相干擾
async function runSerialTests() {
  const saved = [allDogs, groupMap, activeTab, searchQuery, loadState, loadWarning];
  const realFetch = window.fetch;
  const main = document.getElementById('main');
  const tabNames = () => [...document.querySelectorAll('#tabs button .t')].map(t => t.textContent);
  const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.firstChild.textContent);
  const tick = () => new Promise(r => setTimeout(r, 0));
  const json = body => new Response(JSON.stringify(body), { headers: { 'Content-Type': 'application/json' } });
  const DATA = {
    version: 1, syncedAt: '2026-09-25T08:05:00+08:00',
    dogs: [
      { cage: 'A01', id: '9001', name: '讀取甲', walkedDate: null, covered: false, note: '' },
      { cage: 'A02', id: '9002', name: '讀取乙', walkedDate: '2020-01-01', covered: false, note: '' },
    ],
    groups: { '讀取甲': ['讀取乙'], '讀取乙': ['讀取甲'] },
  };
  // fake(url) 回傳 dogs.json 的回應
  const install = fake => {
    const calls = [];
    window.fetch = async (url, opts) => {
      calls.push([String(url), opts && opts.cache]);
      return fake(url);
    };
    return calls;
  };
  const reset = () => { allDogs = []; groupMap = {}; activeTab = 'walk'; searchQuery = ''; };
  try {
    await check('#32 開網頁先出現分類列與「讀取中」，資料到了才畫狗卡', async () => {
      reset();
      let release;
      const calls = install(() => new Promise(r => { release = () => r(json(DATA)); }));
      const done = init();
      eq(tabNames(), ['遛狗表', '常遛狗群', '我溜過', '資訊'], '讀取中就有分類：');
      eq(main.textContent.trim(), '讀取中…', '讀取中：');
      document.querySelector('#tabs button[data-tab="mine"]').click();
      eq(activeTab, 'mine', '讀取中也能切到我溜過：');
      document.querySelector('#tabs button[data-tab="walk"]').click();
      eq(main.textContent.trim(), '讀取中…', '切回溜狗表仍在讀取：');
      release(); await done; await tick();
      eq(calls.filter(c => !/\/walkers$/.test(c[0]))[0], ['api/dogs', 'no-cache'], '讀的檔案（#141 溜狗人名字另外跟 Worker 拿）：');
      onboard = null; renderOnboard(); // init 會開開頭畫面，測試不需要
      if (calls.some(([u]) => /google|gviz/.test(u))) throw new Error('不應連試算表');
      eq(names(), ['讀取甲', '讀取乙'], '狗卡（沒紀錄的在前）：');
      // 顯示成這台裝置的當地時間（在台灣就是 9/25 08:05）
      const t = new Date(DATA.syncedAt);
      eq(document.getElementById('updatedLabel').textContent,
        `資料更新 ${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`, '同步時間：');
      eq([...groupMap['讀取甲']], ['讀取乙'], '可以一起溜：');
      // #62 起讀完狗狗資料後另外讀我的備註（Worker 的 /notes、不行再讀 data/my-notes.json），不算在內
      eq(calls.map(([u]) => u).filter(u => !/\/notes$|my-notes\.json$|api\/walks$|api\/rest$|\/walkers$|\/today$/.test(u)), ['api/dogs'], '只讀 /api/dogs，不再逐隻抓 dogs/*.md：');
    });
    await check('#32／#247 狗的資料讀取失敗（含 D1 出錯回 503）：標題、搜尋、分類都在，內容區顯示錯誤，可重新讀取', async () => {
      reset();
      document.getElementById('updatedLabel').textContent = '';
      for (const fake of [() => new Response(JSON.stringify({ ok: false, code: 'db', error: '資料庫暫時讀不到狗的資料，請稍後再試' }), { status: 503 }), () => new Response('Not Found', { status: 404 }), () => { throw new TypeError('Failed to fetch'); }, () => new Response('{壞掉')]) {
        install(fake);
        await init();
        eq(tabNames(), ['遛狗表', '常遛狗群', '我溜過', '資訊'], '分類：');
        eq(main.querySelector('.status-msg').firstChild.textContent, '狗的資料讀不到，請確認網路後按「重新讀取」。', '錯誤訊息：');
        eq(document.querySelectorAll('#main .card').length, 0, '沒有狗卡：');
      }
      install(() => json(DATA));
      document.getElementById('retryBtn').click();
      await tick(); await tick();
      eq(names().length, 2, '按重新讀取後：');
    });
    await check('#32 dogs.json 少了可以一起溜：狗卡照常顯示，上方提醒', async () => {
      reset();
      const { groups, ...noGroups } = DATA;
      install(() => json(noGroups));
      await init(); await tick();
      eq(names().length, 2, '狗卡：');
      if (!main.querySelector('.alert-box.warn')) throw new Error('要提醒可以一起溜讀不到');
      eq(JSON.stringify(groupMap), '{}', '可以一起溜：');
    });
  } finally {
    window.fetch = realFetch;
    [allDogs, groupMap, activeTab, searchQuery, loadState, loadWarning] = saved;
    onboard = null; renderOnboard(); // init 會開開頭畫面（後面的網頁設成不能點），關掉才不影響後面的測試
    render();
  }
}

// 主照片裁切；相簿 K 2026-10-09 拿掉（怕 Cloudflare 用量爆掉），只留主照片
async function runCropTests() {

  const lb = () => document.getElementById('lightbox');
  const isOpen = () => !!lb() && !lb().hidden;
  const popped = () => new Promise(r => window.addEventListener('popstate', () => setTimeout(r, 0), { once: true }));
  // 做一張有顏色的照片（寬 w、高 h），裁切測試用
  const colorPhoto = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#c33'; ctx.fillRect(0, 0, w / 2, h); ctx.fillStyle = '#33c'; ctx.fillRect(w / 2, 0, w / 2, h); return c.toDataURL('image/png'); };
  const blobSize = blob => new Promise((r, j) => { const img = new Image(); img.onload = () => r([img.naturalWidth, img.naturalHeight]); img.onerror = j; img.src = URL.createObjectURL(blob); });
  const cropEl = () => document.getElementById('cropper');
  // 開裁切要先等照片 decode 完才出現（CI 慢時超過 50ms）；還沒出現就按 Esc 會關掉詳細資訊、清掉 photoUpload
  const until = async (ok, what) => { for (let i = 0; i < 200; i++) { if (ok()) return; await new Promise(r => setTimeout(r, 10)); } throw new Error(`等不到${what}`); };
  const openCrop = async () => { document.getElementById('photoCrop').click(); await until(() => cropOpen() && cropView && cropView.frame, '裁切畫面出現'); };
  const doneCrop = async old => { const p = popped(); document.getElementById('cropDone').click(); await p; await until(() => photoUpload && photoUpload.url !== old, '預覽換成裁好的'); };
  try {
    box.classList.remove('hidden');
    UPLOAD_URL = 'https://worker.test';
    allDogs = [
      { id: '9301', name: '裁切甲', cage: 'A01', note: '', covered: false, walkedDate: null },
    ];

    walkedStorage = fakeStorage(); walkedMemory = null;
    photoOverrides['9301'] = PX;
    render();
    await check('K 2026-10-09 相簿拿掉：詳細資訊沒有相簿段落，燈箱只有主照片、沒有換張箭頭和張數', async () => {
      showDetail(allDogs[0]);
      eq([document.querySelector('#detail [data-section="gallery"]'), document.getElementById('galleryAdd')], [null, null], '沒有相簿：');
      document.querySelector('#detail [data-zoom]').click();
      eq([isOpen(), lb().querySelectorAll('.lightbox-nav, .lightbox-count').length, lb().querySelector('img').getAttribute('src')], [true, 0, PX], '燈箱：');
      const p = popped(); closeLightbox(); await p;
      hideDetail();
    });
    await check('裁切：主照片預覽按「裁切」預設正方形，拖曳不會露出空白，完成後預覽換成裁好的', async () => {
      showDetail(allDogs[0]);
      const file = await (await realFetch(colorPhoto(800, 400))).blob();
      await preparePhoto(allDogs[0], new File([file], 'a.png', { type: 'image/png' }));
      const old = photoUpload.url;
      await openCrop();
      eq([cropOpen(), cropEl().querySelector('[aria-pressed="true"]').textContent], [true, '正方形'], '開裁切：');
      cropView.tx += 5000; drawCrop();
      eq(cropView.tx <= cropView.frame.x, true, '拖太右不露空白：');
      await doneCrop(old);
      eq([cropOpen(), photoUpload.url !== old], [false, true], '完成：');
      const [w, h] = await blobSize(photoUpload.blob);
      eq(Math.abs(w - h) <= 1, true, `正方形（${w}×${h}）：`);
      clearPhotoUpload();
      hideDetail();
    });
    await check('裁切：可換比例；Esc 取消不改照片', async () => {
      showDetail(allDogs[0]);
      const file = await (await realFetch(colorPhoto(600, 600))).blob();
      await preparePhoto(allDogs[0], new File([file], 'a.png', { type: 'image/png' }));
      const oldUrl = photoUpload.url;
      await openCrop();
      const p = popped(); document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })); await p;
      eq([cropOpen(), photoUpload.url], [false, oldUrl], 'Esc 取消：');
      await openCrop();
      cropEl().querySelector('[data-aspect="landscape"]').click();
      await doneCrop(oldUrl);
      const [w, h] = await blobSize(photoUpload.blob);
      eq([photoUpload.url !== oldUrl, Math.abs(w / h - 4 / 3) < 0.02], [true, true], `換成橫式（${w}×${h}）：`);
      clearPhotoUpload();
      hideDetail();
    });
  } finally {
    window.fetch = realFetch;
    hideCropper(); hideLightbox(); hideDetail(); clearPhotoUpload(); hideToast();
    delete photoOverrides['9301'];
    box.classList.add('hidden');
    history.replaceState(null, '');
    [allDogs, groupMap, activeTab, searchQuery, walkedStorage, walkedMemory, UPLOAD_URL] = saved;
    render();
  }
}

function show() {
  const failed = results.filter(r => !r.ok);
  const summary = document.getElementById('summary');
  summary.textContent = failed.length ? `${failed.length} 項失敗，${results.length - failed.length} 項通過` : `全部 ${results.length} 項通過`;
  summary.className = failed.length ? 'fail' : 'pass';
  document.getElementById('results').innerHTML = results.map(r =>
    `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.ok ? '' : `<br>${esc(r.msg)}`}</li>`).join('');
}

// 頁首「更新」按鈕：POST Worker /sync，等 dogs.json 的 syncedAt 變新才換上資料
async function runSyncButtonTests() {
  const saved = [allDogs, groupMap, activeTab, searchQuery, window.fetch, dataSyncedAt];
  const btn = document.createElement('button');
  const toast = () => (document.querySelector('#toast .toast-text') || {}).textContent;
  const dogsFile = (at, name) => ({ version: 1, syncedAt: at, groups: {}, dogs: [{ name, id: '2024032902', cage: '新A03', walkedDate: null }] });
  // 假網路：/sync 回 status；dogs.json 依序回 files 的內容（用完就一直回最後一個）
  const fakeNet = (status, files) => {
    const calls = [];
    window.fetch = async (url, init = {}) => {
      calls.push(`${init.method || 'GET'} ${String(url).replace(UPLOAD_URL, 'W')}`);
      if (String(url).endsWith('/sync')) return new Response(JSON.stringify({ ok: status === 200 }), { status });
      if (String(url).endsWith('api/dogs')) return new Response(JSON.stringify(files.length > 1 ? files.shift() : files[0]));
      return new Response('{}', { status: 404 });
    };
    return calls;
  };
  try {
    activeTab = 'walk'; searchQuery = '';
    dataSyncedAt = new Date('2026-09-27T13:24:18+08:00');
    await check('更新按鈕：每 5 秒內就看一次新資料，同步完不再多等一輪 15 秒；總共仍等滿 4 分鐘', async () => {
      if (!(SYNC_POLL_MS <= 5000)) throw new Error(`輪詢間隔 ${SYNC_POLL_MS}ms 太長`);
      eq(SYNC_POLL_MS * SYNC_POLL_TRIES >= 4 * 60 * 1000, true);
    });
    await check('更新按鈕：叫同步後等到 syncedAt 變新才換上資料、顯示更新時間', async () => {
      const calls = fakeNet(200, [dogsFile('2026-09-27T13:24:18+08:00', '舊'), dogsFile('2026-09-27T15:02:00+08:00', '新狗')]);
      await requestSync(btn, { pollMs: 0, tries: 5 });
      eq(calls.slice(0, 1), ['POST W/sync']);
      eq(allDogs.map(d => d.name), ['新狗']);
      const t = new Date('2026-09-27T15:02:00+08:00'); // 測試機器時區不一定是台灣
      eq(document.getElementById('updatedLabel').textContent, `資料更新 ${t.getMonth() + 1}/${t.getDate()} ${pad2(t.getHours())}:${pad2(t.getMinutes())}`);
      eq(toast(), '資料已更新');
      eq(btn.classList.contains('syncing'), false, '轉圈停了：');
    });
    await check('更新按鈕：試算表沒新東西就說已是最新；Worker 失敗不去等', async () => {
      fakeNet(200, [dogsFile('2026-09-27T15:02:00+08:00', '新狗')]);
      await requestSync(btn, { pollMs: 0, tries: 3 });
      eq(toast(), '已經是最新的');
      const calls = fakeNet(502, [dogsFile('2026-09-27T16:00:00+08:00', '不該換')]);
      await requestSync(btn, { pollMs: 0, tries: 3 });
      eq(toast(), '更新失敗：HTTP 502', '沒有原因只顯示狀態碼：');
      eq(calls, ['POST W/sync'], '失敗不讀 dogs.json：');
      eq(allDogs.map(d => d.name), ['新狗']);
      window.fetch = async () => new Response(JSON.stringify({ ok: false, error: '叫同步失敗（GitHub 403）' }), { status: 502 });
      await requestSync(btn, { pollMs: 0, tries: 1 });
      eq(toast(), '更新失敗：叫同步失敗（GitHub 403）', 'Worker 說的原因：');
    });
    await check('更新按鈕：Worker 說試算表沒變（unchanged）就不等，直接說已是最新（#305）', async () => {
      const calls = [];
      window.fetch = async (url, init = {}) => { calls.push(`${init.method || 'GET'} ${String(url).replace(UPLOAD_URL, 'W')}`); return new Response(JSON.stringify({ ok: true, unchanged: true })); };
      await requestSync(btn, { pollMs: 0, tries: 3 });
      eq(calls, ['POST W/sync'], '不讀 dogs.json：');
      eq(toast(), '試算表沒有新的修改，已經是最新的');
    });
    await check('更新按鈕：剛按過（429）還是會等新資料', async () => {
      fakeNet(429, [dogsFile('2026-09-27T16:30:00+08:00', '再新')]);
      await requestSync(btn, { pollMs: 0, tries: 2 });
      eq(allDogs.map(d => d.name), ['再新']);

      if (!/id="syncBtn"[^>]*aria-label="更新資料"/.test(INDEX_HTML)) throw new Error('index.html 沒有更新按鈕');

  } finally {
    [allDogs, groupMap, activeTab, searchQuery, window.fetch, dataSyncedAt] = saved;
    hideToast();
  }
}

      eq(walkerChipsHtml(allDogs[1], [], new Date()), '<span class="lw-none">—</span>', '有網路沒名字：');
    });
  } finally {
    [allDogs, groupMap, walkedStorage, walkedMemory, dataSyncedAt, walkerNamesOffline] = saved;

  }
}

async function runFix141Tests() {
  const saved = [allDogs, groupMap, activeTab, searchQuery, walkedStorage, walkedMemory, UPLOAD_URL, window.fetch, walkerNames, walkerNameList, sheetWritesMemory, sheetWriteState, walkerNameMemory, walkerCodesMemory];
  const json = (body, status = 200) => new Response(JSON.stringify(body), { status });
  const tick = () => new Promise(r => setTimeout(r, 0));
  const today = localDateKey(new Date());
  try {
    await check('K 2026-10-05：同一隻狗同一天以最後一筆為準，後來把我拿掉就不算我溜的', () => {
      const walks = parseMyWalks({ version: 1, walks: [
        { id: '9801', name: '修正甲', date: '2026-10-04', mine: false, walkers: ['bbbbbbbbbbbb'] },
        { id: '9801', name: '修正甲', date: '2026-10-04', mine: true, walkers: ['bbbbbbbbbbbb', 'aaaaaaaaaaaa'] },
        { id: '9801', name: '修正甲', date: '2026-10-04', mine: false, walkers: ['bbbbbbbbbbbb'] },
        { id: '9802', name: '修正乙', date: '2026-10-04', mine: true, walkers: ['aaaaaaaaaaaa'] },
        { id: '9801', name: '修正甲', date: '2026-10-03', mine: true, walkers: ['aaaaaaaaaaaa'] },
      ] }, ['aaaaaaaaaaaa']);
      eq(walks.map(w => `${w.name} ${w.ymd}`), ['修正乙 2026-10-04', '修正甲 2026-10-03']);
    });
    allDogs = [
      { id: '9811', name: '修正丙', cage: 'A01', note: '', covered: false, walkedDate: new Date(), formerIds: [] },
      { id: '9812', name: '修正丁', cage: 'A02', note: '', covered: false, walkedDate: null, formerIds: [] },
      { id: '9813', name: '修正戊', cage: 'A03', note: '', covered: false, walkedDate: new Date(), formerIds: [] },
    ];
    groupMap = {}; activeTab = 'walk'; searchQuery = '';
    walkedStorage = fakeStorage(); walkedMemory = null; walkedCache = null; sheetWritesMemory = null; sheetWriteState = 'unknown';
    saveWalkerName('K'); UPLOAD_URL = 'https://worker.test';
    walkerNames = { '9811': '岑', '9813': '志工乙' }; walkerNameList = [];
    const bodies = [];
    window.fetch = async (u, o) => {
      const body = JSON.parse(o.body); bodies.push(body);
      const results = body.dogs.map(d => {
        if (body.action === 'undo') return { id: d.id, name: d.name, status: 'restored' };
        const now = walkerNames[d.id] || '';
        if (splitWalkers(now).includes(body.walker)) return { id: d.id, name: d.name, status: 'already', current: { date: today, walker: now } };
        const wrote = now ? `${now}、${body.walker}` : body.walker;
        return { id: d.id, name: d.name, status: 'written', prev: { date: { text: '' }, walker: now }, wrote: { walker: wrote } };
      });
      return json({ ok: true, today, results });
    };
    await check('K 2026-10-05：「岑」和「K」是同一人，只顯示一次', () => {
      eq(walkerList({ id: '9890', name: '假' }), [], '沒名字：');
      walkerNames['9890'] = '岑、K、志工乙';
      eq(walkerList({ id: '9890', name: '假' }), ['K', '志工乙']);
      delete walkerNames['9890'];
    });
    await check('K 2026-10-05：那格已經有「岑」，按溜了送「岑」（小程式不動），其他狗照常送「K」', async () => {
      setWalked([allDogs[0], allDogs[1]], true);
      await sheetQueue; await tick();
      eq(bodies.map(b => [b.action, b.walker, b.dogs.map(d => d.id)]), [['walk', '岑', ['9811']], ['walk', 'K', ['9812']]], '送出：');
      showDetail(allDogs[0]);
      eq([...document.querySelectorAll('.last-walk .who-chip')].map(c => c.firstChild.textContent), ['K'], '顯示：');
      hideDetail(); hideToast();
    });
    await check('K 2026-10-05：只有自己一人、是這支手機登記的，名字旁有 ×，按了取消這次登記', async () => {
      showDetail(allDogs[1]);
      const x = document.querySelector('.last-walk [data-who-undo]');
      if (!x) throw new Error('沒有 ×');
      bodies.length = 0;
      x.click();
      await sheetQueue; await tick();
      eq(bodies.map(b => [b.action, b.dogs.map(d => d.id)]), [['undo', ['9812']]], '送出：');
      eq(walkedNow(allDogs[1]), false, '今天已溜拿掉：');
      hideDetail(); hideToast();
    });
    await check('K 2026-10-05：只有別人一人時不給 ×（不能拿掉別人唯一的登記）', () => {
      showDetail(allDogs[2]);
      eq([[...document.querySelectorAll('.last-walk .who-chip')].map(c => c.firstChild.textContent), document.querySelectorAll('.last-walk .who-x').length, !!document.getElementById('whoAdd')], [['志工乙'], 0, true]);
      hideDetail();
    });
  } finally {
    hideDetail(); hideToast();
    [allDogs, groupMap, activeTab, searchQuery, walkedStorage, walkedMemory, UPLOAD_URL, window.fetch, walkerNames, walkerNameList, sheetWritesMemory, sheetWriteState, walkerNameMemory, walkerCodesMemory] = saved;
    walkedCache = null;
    render();
  }
}

async function runTourLayoutTests() {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'position:absolute;left:-9999px;width:390px;height:660px;border:0';
  const ready = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  frame.srcdoc = INDEX_HTML.replace('<head>', `<head><base href="${new URL('../public/', location.href)}"><script>window.__BQ_TEST__=true;<\/script>`);
  document.body.appendChild(frame);
  await ready;
  const win = frame.contentWindow;
  win.__tourFixture = await fetch('fixtures/dogs.json').then(r => r.json());
  try {
    win.eval(`
      const fixtureStorage = new Map();
      walkedStorage = { getItem: k => fixtureStorage.get(k) || null, setItem: (k, v) => fixtureStorage.set(k, v), removeItem: k => fixtureStorage.delete(k) };
      const originalMedia = window.matchMedia.bind(window);
      window.__tourMedia = originalMedia;
      window.matchMedia = q => q.includes('prefers-reduced-motion') ? { matches: true } : originalMedia(q);
      document.head.insertAdjacentHTML('beforeend', '<style>* { transition: none !important; animation: none !important; }</style>');
      saveWalkerName('測試'); saveMyCodes(['abcdef123456']);
      const fixtureWalks = { walks: parseDogsData(window.__tourFixture).dogs.slice(0, 9).map(d => ({ id: d.id, name: d.name, date: localDateKey(new Date()), walkers: ['abcdef123456'] })) };
      const originalFetch = window.fetch.bind(window);
      window.fetch = (url, ...args) => String(url).includes('api/walks') ? Promise.resolve(new Response(JSON.stringify(fixtureWalks))) : originalFetch(url, ...args);
      applyDogsData(parseDogsData(window.__tourFixture));
      walksData = fixtureWalks; myWalks = parseMyWalks(fixtureWalks); myWalksState = 'ready';
    `);
    for (const demo of ['detail', 'view', 'tab', 'find']) {
      await check(`手機導覽 ${demo}：說明卡不遮擋示範目標、切換鈕不藏在搜尋框下`, async () => {
        win.eval(`
          if (tour) endTour(); activeTab = 'walk'; findZone = 'all'; findCage = null; searchQuery = ''; render(); window.scrollTo(0, 500);
          tour = { step: TOUR_STEPS.findIndex(st => st.demo === '${demo}'), again: true, shown: null, undo: null, timers: [] };
          renderTour(true);
        `);
        await new Promise(r => setTimeout(r, 80));
        const result = win.eval(`(() => {
          placeTour();
          const el = tourShownTarget() || tourTarget(tour.step);
          const a = document.querySelector('.tour-tip').getBoundingClientRect(), b = el.getBoundingClientRect();
          return { overlap: a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top,
            hiddenByHeader: '${demo}' === 'view' && b.top < appHeader.getBoundingClientRect().bottom,
            calendar: '${demo}' !== 'tab' || el.matches('.mc-head') };
        })()`);
        eq(result, { overlap: false, hiddenByHeader: false, calendar: true }, '手機 390×660：');
      });
    }
    await check('手機導覽：工具列縮小可見範圍時，說明卡跟著可見高度定位', () => {
      Object.defineProperty(win, 'visualViewport', { configurable: true, value: { width: 390, height: 500, offsetTop: 24 } });
      win.eval('placeTour()');
      const r = frame.contentDocument.querySelector('.tour-tip').getBoundingClientRect();
      if (r.top < 24 || r.bottom > 524) throw new Error('說明卡超出可見範圍');
      delete win.visualViewport;
    });
    await check('加入主畫面教學：手機有最後一步，桌機與主畫面模式省略；兩種手機都有步驟', () => {
      win.eval('endTour()');
      eq(win.eval('tourStepCount()'), 10, '手機：');
      win.eval('tour = { step: 9, again: true, shown: null, undo: null, timers: [] }; renderTour(true)');
      eq(frame.contentDocument.querySelector('.tour-n').textContent, '10 / 10', '手機最後一步：');
      eq(frame.contentDocument.querySelector('h2#tourTitle').textContent, '加入手機主畫面', '教學標題：');
      frame.style.width = '1280px';
      eq(win.eval('tourStepCount()'), 10, '教學開著時旋轉／改寬度，不遺失最後一步：');
      win.eval('endTour()');
      eq(win.eval('tourStepCount()'), 9, '桌機：');
      frame.style.width = '390px';
      win.eval(`window.matchMedia = q => q === '(display-mode: standalone)' ? { matches: true } : window.__tourMedia(q)`);
      eq(win.eval('tourStepCount()'), 9, '主畫面模式：');
      const html = win.eval('tourInstallHtml()');
      if (!html.includes('Safari') || !html.includes('Chrome') || !html.includes('加入主畫面')) throw new Error('缺少手機操作步驟');
    });
  } finally {
    win.eval('if (tour) endTour()');
    frame.remove();
  }
}
