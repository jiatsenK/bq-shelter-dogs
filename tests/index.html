<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>板收志工溜狗表：資料讀取測試</title>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 16px; background: #EEF4FB; color: #1E2A44; }
  h1 { font-size: 20px; }
  #summary { font-size: 18px; font-weight: 700; margin: 12px 0; }
  .pass { color: #2E8B45; } .fail { color: #D93036; }
  li { margin: 4px 0; line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
<h1>板收志工溜狗表：資料讀取測試</h1>
<p>這頁只用假資料檢查 js/app.js 的讀取與畫面（另外會讀 repo 裡的 data/dogs.json 檢查格式）。試算表解析與狗卡資訊（dogs/*.md）整理的測試在 scripts/sync-sheet.test.mjs。</p>
<div id="summary">測試中…</div>
<ol id="results"></ol>

<!-- js/app.js 在載入時會用到這幾個元素 -->
<div class="hidden">
  <input id="searchInput"><button id="searchClear" hidden></button><div id="tabs"></div><main id="main"></main>
  <span id="dateLabel"></span><span id="updatedLabel"></span>
  <div id="detailBackdrop" hidden><div id="detail"></div></div>
</div>

<script>
window.__BQ_TEST__ = true;
const results = [];
function check(name, fn) {
  return Promise.resolve().then(fn).then(
    () => results.push({ name, ok: true }),
    e => results.push({ name, ok: false, msg: e && e.message ? e.message : String(e) }));
}
function eq(actual, expected, label = '') {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error(`${label}預期 ${b}，實際 ${a}`);
}
const ymd = d => d ? `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` : null;

const TODAY = new Date(2026, 8, 24, 10);
// #35 測試用的假 localStorage：測試頁跟網站同網域，不能動到志工手機上真正的「今天已溜」
function fakeStorage() {
  const data = {};
  return { getItem: k => (k in data ? data[k] : null), setItem: (k, v) => { data[k] = String(v); }, removeItem: k => { delete data[k]; } };
}
let INDEX_HTML = ''; // index.html 原始碼，#10 唯讀檢查用（其他測試會替換 fetch，所以先存下來）
let APP_JS = '';     // js/app.js 原始碼（#30 拆檔後程式在這裡）
let ANALYSIS_JS = ''; // js/analysis.js 原始碼（#59 分析頁）
let MAKE_THUMBS_YML = ''; // .github/workflows/make-thumbs.yml（#83 縮圖 Action）
let MANIFEST = {};    // manifest.webmanifest，#33 主畫面名稱檢查用
let DOGS_JSON = null; // data/dogs.json，#32 格式檢查用

function runTests() {
  return Promise.all([
    check('未來日期顯示「日期異常」，不顯示負的天數', () => {
      const badge = statusBadge({ name: 'x', walkedDate: new Date(2099, 0, 1), covered: false, note: '' }, TODAY);
      if (!badge.includes('日期異常') || badge.includes('-')) throw new Error(`標籤是 ${badge}`);
    }),
    check('勿溜：異體字也算，住院不算', () => {
      eq(specialFlag('勿遛，散步時勿溜太久'), { keywords: ['勿溜'], terms: ['勿溜', '勿遛'] });
      eq(specialFlag('住院區，胸背帶放住院'), null);
      eq(specialFlag('親人，好牽'), null);
      eq(specialFlag(''), null);
    }),
    check('勿溜：備註裡每個命中的字眼都標出來，其他文字照樣跳脫', () => {
      const note = '勿溜<先問>，下午再勿遛';
      eq(highlightNote(note, specialFlag(note).terms), '<mark>勿溜</mark>&lt;先問&gt;，下午再<mark>勿遛</mark>');
    }),
    check('勿溜的狗仍留在溜狗表，卡片有天數和備註原文；沒有特殊狀況分頁', () => {
      allDogs = [
        { cage: '住院區', id: '1', name: '測試甲', walkedDate: new Date(), covered: false, note: '住院' },
        { cage: 'A02', id: '2', name: '測試乙', walkedDate: new Date(), covered: false, note: '' },
        { cage: 'A03', id: '3', name: '測試丙', walkedDate: new Date(), covered: false, note: '勿遛' },
      ];
      groupMap = { '測試丙': new Set(['測試乙']) };
      searchQuery = '';
      const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.textContent).sort();
      activeTab = 'walk'; renderMain(); eq(names(), ['測試甲', '測試乙', '測試丙'].sort(), '溜狗表：');
      const cards = [...document.querySelectorAll('#main .card')];
      const card = n => cards.find(c => c.querySelector('.name').textContent === n);
      if (card('測試甲').querySelector('.warn-note')) throw new Error('住院區的測試甲不該有警示');
      const hei = card('測試丙');
      if (!hei.querySelector('.warn-note') || !hei.querySelector('.last .val.sage')) throw new Error('測試丙要有天數和警示備註');
      eq(hei.querySelector('.warn-note .text').innerHTML, '<mark>勿遛</mark>', '備註：');
      if (hei.querySelector('.body > .warn-note') || !hei.querySelector(':scope > .warn-note')) throw new Error('警示備註要橫跨整張卡片，不可擠在照片右側');
      searchQuery = '測試丙'; renderMain();
      if (!document.querySelector('#main .card .warn-note')) throw new Error('搜尋結果沒有警示備註');
      searchQuery = '';
    }),
    // ── #9 照片與介紹 ──
    check('照片：有編號用 photos/thumbs/{編號}.jpg 縮圖（原圖放 data-full 備用）且延後載入；沒編號直接顯示腳掌、不抓 photos/.jpg', () => {
      const box = document.createElement('div');
      box.innerHTML = photoThumb({ name: '宙斯', id: '202101234' });
      const img = box.querySelector('img');
      eq(img.getAttribute('src'), 'photos/thumbs/202101234.jpg');
      eq(img.dataset.full, 'photos/202101234.jpg', '備用原圖：');
      eq(img.getAttribute('loading'), 'lazy');
      box.innerHTML = photoThumb({ name: '金寶', id: '' });
      eq(box.querySelector('img'), null, '沒編號時的 img：');
      if (!box.querySelector('.thumb-fallback')) throw new Error('沒編號時沒有腳掌圖示');
    }),
    check('詳細資訊：dogs.json 有狗卡資訊才顯示，沒有就顯示提示', () => {
      const intro = dog => {
        const box = document.createElement('div');
        box.innerHTML = detailHtml(dog, TODAY);
        return box.querySelector('[data-section="intro"] .content');
      };
      eq(intro({ name: '宙斯', id: '202101234', cage: 'C03', walkedDate: null, covered: false, note: '', intro: '很親人' }).textContent, '很親人');
      eq(intro({ name: '比比', id: '202102346', cage: 'A08', walkedDate: null, covered: false, note: '', intro: '' }), null, '沒狗卡：');
    }),
    // ── #7 搜尋 ──
    check('搜尋：犬名部分符合即可，忽略空白、全形與大小寫', () => {
      const dog = { name: '測試 Lucky 丁' };
      eq(matchesSearch(dog, '試'), true);
      eq(matchesSearch(dog, 'lucky'), true, '大小寫：');
      eq(matchesSearch(dog, 'ＬＵＣＫＹ丁'), true, '全形、空白：');
      eq(matchesSearch(dog, '  '), true, '只有空白當作沒搜尋：');
      eq(matchesSearch(dog, '測試戊'), false);
    }),
    check('搜尋：只篩選目前分類，分類數字跟著變，清空回到原本內容', () => {
      const daysAgo = n => new Date(Date.now() - n * 86400000);
      allDogs = [
        { cage: 'B01', id: '', name: '搜尋甲', walkedDate: daysAgo(1), covered: false, note: '' },
        { cage: 'B02', id: '', name: '搜尋乙', walkedDate: daysAgo(20), covered: false, note: '勿溜' },
        { cage: 'B02', id: '', name: '別隻丙', walkedDate: daysAgo(2), covered: false, note: '' },
      ];
      groupMap = {};
      const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.textContent);
      const counts = () => [...document.querySelectorAll('#tabs button .n')].map(n => n.textContent);
      const mainText = () => document.getElementById('main').textContent;
      try {
        searchQuery = '搜尋';
        activeTab = 'walk'; renderMain();
        eq(names(), ['搜尋乙', '搜尋甲'], '溜狗表（久沒遛的在前）：');
        eq(counts(), ['2', '0', ''], '分類數字：');
        if (!mainText().includes('搜尋「搜尋」：2 隻')) throw new Error('沒有顯示搜尋結果隻數');
        if (!document.querySelector('#main .card .warn-note')) throw new Error('勿溜的搜尋乙沒有警示備註');
        activeTab = 'today'; renderMain();
        eq(names(), [], '今天已溜（空殼）：');
        if (!mainText().includes('今天已溜裡找不到「搜尋」')) throw new Error(`今天已溜的查無提示：${mainText()}`);
        searchQuery = '<b>沒這隻'; activeTab = 'walk'; renderMain();
        eq(document.querySelector('#main .status-msg').innerHTML, '找不到「&lt;b&gt;沒這隻」');
        eq(counts(), ['0', '0', ''], '查無時分類數字：');
        searchQuery = ''; renderMain();
        eq(names().length, 3, '清空後：');
        eq(counts(), ['3', '0', ''], '清空後分類數字：');
      } finally { searchQuery = ''; activeTab = 'walk'; }
    }),
    check('搜尋：輸入即篩選；注音選字途中不篩選，選好字才更新', () => {
      allDogs = [{ cage: 'B01', id: '', name: '搜尋甲', walkedDate: null, covered: false, note: '' }];
      groupMap = {}; activeTab = 'walk';
      const input = document.getElementById('searchInput');
      try {
        input.value = 'ㄐ';
        input.dispatchEvent(new InputEvent('input', { isComposing: true }));
        eq(searchQuery, '', '選字途中：');
        input.value = '甲';
        input.dispatchEvent(new CompositionEvent('compositionend', { data: '甲' }));
        eq(searchQuery, '甲', '選好字：');
        eq(document.querySelectorAll('#main .card').length, 1);
        input.value = '';
        input.dispatchEvent(new InputEvent('input'));
        eq(searchQuery, '', '清空：');
      } finally { input.value = ''; searchQuery = ''; }
    }),
    check('#3 色標邊界：0～6 天綠、第 7 天起黃、第 30 天起紅', () => {
      const daysAgo = n => ({ name: '測試狗', walkedDate: new Date(2026, 8, 24 - n), covered: false });
      const level = n => computeStatus(daysAgo(n), TODAY).level;
      eq([0, 6, 7, 29, 30, 45].map(level), ['sage', 'sage', 'amber', 'amber', 'red', 'red']);
      const box = document.createElement('div');
      box.innerHTML = statusBadge(daysAgo(30), TODAY);
      eq(box.querySelector('.badge').className, 'badge red', '30 天徽章：');
      eq(box.querySelector('.badge').textContent, '30 天前', '30 天徽章文字：');
    }),
    check('#3 待巡房排序：沒紀錄最前，再由久到近，有人固定照顧最後；所有狗都在', () => {
      const d = (name, n, covered = false) => ({ name, walkedDate: n == null ? null : new Date(2026, 8, 24 - n), covered });
      const dogs = [d('甲', 3), d('乙', null, true), d('丙', 40), d('丁', null), d('戊', 0), d('己', 12)];
      eq(dueDogs(dogs, TODAY).map(x => x.name), ['丁', '丙', '己', '甲', '戊', '乙']);
    }),
    check('#10 唯讀：除搜尋框外沒有輸入框、勾選框、可編輯區塊；搜尋框有放大鏡與提示文字', () => {
      const doc = new DOMParser().parseFromString(INDEX_HTML, 'text/html');
      const inputs = [...doc.querySelectorAll('input, textarea, select, [contenteditable]')];
      eq(inputs.map(el => el.id), ['searchInput'], '可輸入元素：');
      const box = inputs[0];
      eq(box.type, 'search', '搜尋框型別：');
      eq(box.placeholder, '搜尋犬名', '提示文字：');
      if (!box.parentElement.querySelector('use[href="#i-search"]')) throw new Error('搜尋框旁要有放大鏡圖示');
      if (doc.querySelector('form')) throw new Error('頁面不應有表單');
      const symbols = [...doc.querySelectorAll('symbol')].map(el => el.id).join(' ');
      // #28 起卡片可以點開詳細資訊，所以允許右箭頭（chevron）；編輯、勾選圖示仍不行
      // （#35「今天已溜」的打勾圖示叫 i-tick，只記在這支手機，不是編輯試算表）
      if (/edit|pencil|pen|check/i.test(symbols)) throw new Error(`不應有編輯或勾選圖示：${symbols}`);
    }),
    check('#10 唯讀：程式只有讀取，沒有寫入試算表的呼叫；唯一的上傳只送到照片上傳服務（#48）', () => {
      // #48 起唯一的寫入是把照片 POST 到 UPLOAD_URL（Cloudflare Worker），先把那一段拿掉再檢查其他地方
      const uploadCall = /fetch\(`\$\{UPLOAD_URL\}\/photos\/\$\{encodeURIComponent\(up\.dog\.id\)\}`, \{\s*method: 'POST',/;
      if (!uploadCall.test(APP_JS)) throw new Error('找不到照片上傳的呼叫');
      // 相簿照片（可一次好幾張）POST 到同一個 Worker 的 /gallery/{編號}，也先拿掉
      const galleryCall = /fetch\(`\$\{UPLOAD_URL\}\/gallery\/\$\{encodeURIComponent\(id\)\}`, \{\s*method: 'POST',/;
      if (!galleryCall.test(APP_JS)) throw new Error('找不到相簿上傳的呼叫');
      // #62 起「我的備註」PUT 到同一個 Worker 的 /notes/{編號}（寫進 Git，不是試算表），也先拿掉
      const noteCall = /fetch\(`\$\{UPLOAD_URL\}\/notes\/\$\{encodeURIComponent\(edit\.dog\.id\)\}`, \{\s*method: 'PUT',/;
      if (!noteCall.test(APP_JS)) throw new Error('找不到我的備註儲存的呼叫');
      // 相簿刪除照片：DELETE 到同一個 Worker 的 /gallery/{編號}/{檔名}（要通關碼），也先拿掉
      const galleryDeleteCall = /fetch\(`\$\{UPLOAD_URL\}\/gallery\/\$\{encodeURIComponent\(del\.dog\.id\)\}\/\$\{encodeURIComponent\(del\.file\)\}`, \{\s*method: 'DELETE',/;
      if (!galleryDeleteCall.test(APP_JS)) throw new Error('找不到相簿刪除照片的呼叫');
      // 相簿照片設為主照片：POST 到 /gallery/{編號}/{檔名}/main，也先拿掉
      const galleryMainCall = /fetch\(`\$\{UPLOAD_URL\}\/gallery\/\$\{encodeURIComponent\(dog\.id\)\}\/\$\{encodeURIComponent\(file\)\}\/main`, \{ method: 'POST' \}\)/;
      if (!galleryMainCall.test(APP_JS)) throw new Error('找不到設為主照片的呼叫');
      // #96 我是誰：名字 POST 到 /walker-code 換代號（不寫任何東西），也先拿掉
      const walkerCall = /fetch\(`\$\{UPLOAD_URL\}\/walker-code`, \{\s*method: 'POST',/;
      if (!walkerCall.test(APP_JS)) throw new Error('找不到換代號的呼叫');
      const code = APP_JS.replace(uploadCall, '').replace(galleryCall, '').replace(noteCall, '').replace(galleryDeleteCall, '').replace(galleryMainCall, '').replace(walkerCall, '');
      const bad = [/method\s*:/i, /\bPOST\b|\bPUT\b|\bPATCH\b|\bDELETE\b/, /script\.google\.com|macros\/s\//, /sheets\.googleapis\.com/,
        /appendRow|setValue|batchUpdate|XMLHttpRequest|sendBeacon|indexedDB|sessionStorage|document\.cookie/];
      const hits = bad.filter(re => re.test(code)).map(String);
      eq(hits, [], '寫入相關字眼：');
      // #48 GitHub 寫入權限只在 Worker：網站程式不能有 token 或直接連 GitHub API
      const tokenHits = [/ghp_|gho_|github_pat_/, /api\.github\.com/, /Authorization|Bearer/i, /GITHUB_TOKEN/].filter(re => re.test(APP_JS)).map(String);
      eq(tokenHits, [], 'GitHub 憑證相關字眼：');
      // #35 起「今天已溜」存在這支手機的 localStorage，只准用 WALKED_KEY；#62 加上我的備註通關碼 NOTES_PASS_KEY
      eq([...code.matchAll(/\blocalStorage\s*[.[]|window\.localStorage/g)].length, 1, 'localStorage 只在一個地方取用：');
      eq([...code.matchAll(/\.(setItem|getItem|removeItem)\(([^,)]*)/g)].map(m => m[2]), ['WALKER_CODES_KEY', 'WALKER_CODES_KEY', 'WALKER_CODES_KEY', 'WALKED_KEY', 'WALKED_KEY', 'NOTES_PASS_KEY', 'NOTES_PASS_KEY', 'NOTES_PASS_KEY', 'HIDDEN_KEY', 'HIDDEN_KEY'], '只讀寫 WALKER_CODES_KEY（#96 我是誰）、WALKED_KEY、NOTES_PASS_KEY、HIDDEN_KEY（#79 收起）：');
      const urls = [...code.matchAll(/fetch\(([^)]*)\)/g)].map(m => m[1].trim());
      eq(urls.length, 3, 'fetch 呼叫數（上傳以外）：');
      // #32 起前端只讀 data/dogs.json，不直接連試算表；狗卡資訊也已經寫在 dogs.json 裡，不再抓 dogs/*.md
      // #62 另外讀我的備註：只從 Worker 的 /notes 或網站上的 data/my-notes.json 讀
      // #58 我最近溜過另外讀 data/walks.json
      if (!urls.every(u => u.startsWith('DATA_URL,') || u.startsWith('WALKS_URL,') || u === "url, { cache: 'no-store' }")) throw new Error(`只能讀 data/dogs.json、data/walks.json 與我的備註：${urls.join('、')}`);
      // 相簿清單也一樣：只從 Worker 的 /gallery 或網站上的 data/gallery.json 讀
      const noteReads = [...APP_JS.matchAll(/await readJsonObject\(([^,]+),/g)].map(m => m[1]);
      eq(noteReads, ['`${UPLOAD_URL}/gallery`', 'GALLERY_URL', '`${UPLOAD_URL}/notes`', 'MY_NOTES_URL'], '我的備註、相簿清單讀取來源：');
      eq(MY_NOTES_URL, 'data/my-notes.json', '我的備註檔：');
      eq(GALLERY_URL, 'data/gallery.json', '相簿清單檔：');
      eq(DATA_URL, 'data/dogs.json', '資料檔：');
      eq(WALKS_URL, 'data/walks.json', '遛狗紀錄檔：');
      if (/docs\.google\.com|gviz/.test(APP_JS)) throw new Error('前端不應再連 Google 試算表');
    }),
    check('#10／#28 卡片沒有連結，也不會跳到別頁（點了只開詳細資訊）', () => {
      const box = document.createElement('div');
      box.innerHTML = dogCard({ name: '測試狗', cage: 'A01', id: '1', walkedDate: null, covered: false, note: '勿溜' }, TODAY);
      if (box.querySelector('a, [onclick], [href]:not(use)')) throw new Error('卡片裡不應有連結');
    }),
    check('#10 試算表文字一律跳脫：備註、犬名、籠位、編號、可一起遛、搜尋字', () => {
      const evil = '<img src=x onerror="window.__xss=1"><b>粗</b>&amp;';
      const dog = { name: evil, cage: evil, id: evil, walkedDate: null, covered: false, note: evil + '勿溜', intro: evil };
      const saved = [groupMap, allDogs, activeTab, searchQuery];
      try {
        groupMap = { [evil]: new Set([evil]) };
        const box = document.createElement('div');
        box.innerHTML = dogCard(dog, TODAY);
        eq(box.querySelectorAll('.body img, .body b').length, 0, '卡片裡被當成 HTML 的元素：');
        eq(box.querySelector('.name').textContent, evil, '犬名原文：');
        if (!box.querySelector('.warn-note .text').textContent.startsWith(evil)) throw new Error('備註要原樣顯示文字');
        box.innerHTML = detailHtml(dog, TODAY);
        eq(box.querySelectorAll('.info img, section img:not(.thumb img):not(.g-tile img), section b').length, 0, '詳細資訊裡被當成 HTML 的元素：');
        eq(box.querySelector('.buddy .bname').textContent, evil, '可一起遛原文：');
        eq(box.querySelector('[data-section="intro"] .content').textContent, evil, '狗卡資訊原文：');
        allDogs = [dog]; activeTab = 'walk'; searchQuery = '';
        render();
        eq(document.querySelectorAll('#main img:not(.thumb img)').length, 0, '清單被當成 HTML 的圖片：');
        searchQuery = evil; render();
        searchQuery = '<i>沒有這隻</i>'; render();
        if (document.querySelector('#main i')) throw new Error('搜尋字不應被當成 HTML');
        if (window.__xss) throw new Error('跳脫失敗，執行了試算表裡的程式');
      } finally {
        [groupMap, allDogs, activeTab, searchQuery] = saved;
        render();
      }
    }),
    // ── #28 卡片高密度化與詳細資訊 ──
    check('#28 警示關鍵字：勿溜、不要、攻擊、不親狗、不親任一命中就算，原文不改', () => {
      const hit = note => { const f = specialFlag(note); return f ? f.keywords : null; };
      eq(hit('不親狗，請單獨遛'), ['不親狗', '不親'], '不親狗：');
      eq(hit('會攻擊黑色狗'), ['攻擊']);
      eq(hit('不要跟小白一起遛'), ['不要']);
      eq(hit('勿溜，治療中'), ['勿溜']);
      eq(hit('勿蹓'), ['勿溜'], '舊有異體字照樣算：');
      eq(hit('親人，好牽，會撒嬌'), null, '一般備註：');

// 會替換 fetch、呼叫 init 的測試一項一項跑，才不會跟其他測試互相干擾
async function runSerialTests() {
  const saved = [allDogs, groupMap, activeTab, searchQuery, loadState, loadWarning];
  const realFetch = window.fetch;
  const main = document.getElementById('main');
  const tabNames = () => [...document.querySelectorAll('#tabs button .t')].map(t => t.textContent);
  const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.firstChild.textContent);
  const tick = () => new Promise(r => setTimeout(r, 0));
  const json = body => new Response(JSON.stringify(body), { headers: { 'Content-Type': 'application/json' } });
  const DATA = {
    version: 1, syncedAt: '2026-09-25T08:05:00+08:00',
    dogs: [
      { cage: 'A01', id: '9001', name: '讀取甲', walkedDate: null, covered: false, note: '' },
      { cage: 'A02', id: '9002', name: '讀取乙', walkedDate: '2020-01-01', covered: false, note: '' },
    ],
    groups: { '讀取甲': ['讀取乙'], '讀取乙': ['讀取甲'] },
  };
  // fake(url) 回傳 dogs.json 的回應
  const install = fake => {
    const calls = [];
    window.fetch = async (url, opts) => {
      calls.push([String(url), opts && opts.cache]);
      return fake(url);
    };
    return calls;
  };
  const reset = () => { allDogs = []; groupMap = {}; activeTab = 'walk'; searchQuery = ''; };
  try {
    await check('#32 開網頁先出現分類列與「讀取中」，資料到了才畫狗卡', async () => {
      reset();
      let release;
      const calls = install(() => new Promise(r => { release = () => r(json(DATA)); }));
      const done = init();
      eq(tabNames(), ['溜狗表', '今天已溜', '我溜過'], '讀取中就有分類：');
      eq(main.textContent.trim(), '讀取狗狗資料中…', '讀取中：');
      document.querySelector('#tabs button[data-tab="mine"]').click();
      eq(activeTab, 'mine', '讀取中也能切到我溜過：');
      document.querySelector('#tabs button[data-tab="walk"]').click();
      eq(main.textContent.trim(), '讀取狗狗資料中…', '切回溜狗表仍在讀取：');
      release(); await done; await tick();
      eq(calls[0], ['data/dogs.json', 'no-cache'], '讀的檔案：');
      if (calls.some(([u]) => /google|gviz/.test(u))) throw new Error('不應連試算表');
      eq(names(), ['讀取甲', '讀取乙'], '狗卡（沒紀錄的在前）：');
      // 顯示成這台裝置的當地時間（在台灣就是 9/25 08:05）
      const t = new Date(DATA.syncedAt);
      eq(document.getElementById('updatedLabel').textContent,
        `資料更新 ${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`, '同步時間：');
      eq([...groupMap['讀取甲']], ['讀取乙'], '可以一起溜：');
      // #62 起讀完狗狗資料後另外讀我的備註（Worker 的 /notes、不行再讀 data/my-notes.json），不算在內
      // 相簿起也另外讀相簿清單（Worker 的 /gallery、不行再讀 data/gallery.json）
      eq(calls.map(([u]) => u).filter(u => !/\/notes$|my-notes\.json$|walks\.json$|\/gallery$|gallery\.json$/.test(u)), ['data/dogs.json'], '只讀 dogs.json，不再逐隻抓 dogs/*.md：');
    });
    await check('#32 dogs.json 讀取失敗：標題、搜尋、分類都在，內容區顯示錯誤，可重新讀取', async () => {
      reset();
      document.getElementById('updatedLabel').textContent = '';
      for (const fake of [() => new Response('Not Found', { status: 404 }), () => { throw new TypeError('Failed to fetch'); }, () => new Response('{壞掉')]) {
        install(fake);
        await init();
        eq(tabNames(), ['溜狗表', '今天已溜', '我溜過'], '分類：');
        eq(main.querySelector('.status-msg').firstChild.textContent, '資料載入失敗，請稍後重新整理。', '錯誤訊息：');
        eq(document.querySelectorAll('#main .card').length, 0, '沒有狗卡：');
      }
      install(() => json(DATA));
      document.getElementById('retryBtn').click();
      await tick(); await tick();
      eq(names().length, 2, '按重新讀取後：');
    });
    await check('#32 dogs.json 少了可以一起溜：狗卡照常顯示，上方提醒', async () => {
      reset();
      const { groups, ...noGroups } = DATA;
      install(() => json(noGroups));
      await init(); await tick();
      eq(names().length, 2, '狗卡：');
      if (!main.querySelector('.alert-box.warn')) throw new Error('要提醒可以一起溜讀不到');
      eq(JSON.stringify(groupMap), '{}', '可以一起溜：');
    });
  } finally {
    window.fetch = realFetch;
    [allDogs, groupMap, activeTab, searchQuery, loadState, loadWarning] = saved;
    render();
  }
}

    W('2020010102', '歷乙', '2026-10-01'), W('2020010102', '歷乙', '2026-10-15'),

    eq([h.count, +h.avgGap.toFixed(3), h.maxGap], [14, +(32 / 14).toFixed(3), 6], '歷甲：');

      eq([...sec.querySelectorAll('.w-num b')].map(b => b.textContent), ['14', '2.3', '6'], '數字：');

      hideAnalysis(); hideDetail(); history.replaceState(null, '');
      [allDogs, groupMap, activeTab, searchQuery, photoCheck, historyData] = saved;
      render();
    }
  });
}

function show() {
  const failed = results.filter(r => !r.ok);
  const summary = document.getElementById('summary');
  summary.textContent = failed.length ? `${failed.length} 項失敗，${results.length - failed.length} 項通過` : `全部 ${results.length} 項通過`;
  summary.className = failed.length ? 'fail' : 'pass';
  document.getElementById('results').innerHTML = results.map(r =>
    `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.ok ? '' : `<br>${esc(r.msg)}`}</li>`).join('');
}

// #85 今天已溜模組：walkedToday（查詢）、recordWalked（記下／移回＋復原），不碰畫面
async function runWalkedModuleTests() {

  const a = { name: '模組甲', id: '9501' }, b = { name: '模組乙', id: '9502' }, noId = { name: '新來的', id: '' }, nobody = { name: '', id: '' };

      const r1 = recordWalked([a], true, day);
      const r2 = recordWalked([b, a, noId, nobody, b], true, day);
      eq([r1.changed, r2.changed].map(c => c.map(d => d.name)), [['模組甲'], ['模組乙', '新來的']], '有變的狗：');
      const w = walkedToday(day);
      eq([w.has(a), w.has(b), w.has(noId), w.has(nobody)], [true, true, true, false], 'has：');

    });
    check('#85 移回與復原；都沒變就不寫入', () => {
      const { changed, undo } = recordWalked([b], false, day);
      eq([changed.length, walkedToday(day).has(b)], [1, false], '移回：');
      undo();
      eq(walkedToday(day).dogs([a, b, noId]).map(d => d.name), ['新來的', '模組乙', '模組甲'], '復原回到原本順序：');
      const before = walkedStorage.getItem(WALKED_KEY);
      eq(recordWalked([a], true, day).changed.length, 0, '已經記過：');
      eq(walkedStorage.getItem(WALKED_KEY), before, '沒變不寫入：');

    check('#85 隔天自動清空', () => {
      eq(walkedToday(next).has(a), false);
      eq(walkedToday(next).dogs([a, b]).length, 0);
    });
  } finally {
    [walkedStorage, walkedMemory] = saved;
  }
}
