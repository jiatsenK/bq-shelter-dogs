<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>板收遛狗：資料讀取測試</title>
<style>
  body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 16px; background: #EEF4FB; color: #1E2A44; }
  h1 { font-size: 20px; }
  #summary { font-size: 18px; font-weight: 700; margin: 12px 0; }

<body>
<h1>板收遛狗：資料讀取測試</h1>
<p>這頁不會連到真正的試算表，只用假資料檢查 js/app.js 的讀取與解析函式。</p>
<div id="summary">測試中…</div>
<ol id="results"></ol>

<!-- js/app.js 在載入時會用到這幾個元素 -->
<div class="hidden">
  <input id="searchInput"><div id="tabs"></div><main id="main"></main>
  <span id="dateLabel"></span><span id="updatedLabel"></span>
  <div id="detailBackdrop" hidden><div id="detail"></div></div>
</div>

<script>
window.__BQ_TEST__ = true;
const results = [];
function check(name, fn) {
  return Promise.resolve().then(fn).then(
    () => results.push({ name, ok: true }),
    e => results.push({ name, ok: false, msg: e && e.message ? e.message : String(e) }));
}
function eq(actual, expected, label = '') {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error(`${label}預期 ${b}，實際 ${a}`);
}
const ymd = d => d ? `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}` : null;

// 模擬 gviz：依每欄多數型別推斷欄位型別，少數型別的格子回成 null；
// headers=N 時前 N 列合併成欄位標題。這就是真實試算表「編號」「遛狗日期」表頭被吃掉的原因。
const D = (y, m, d) => ({ t: 'date', y, m, d });
function typeOf(v) { return typeof v === 'object' ? 'date' : typeof v === 'number' ? 'number' : 'string'; }
function fakeGviz(grid, headers) {
  const hdr = grid.slice(0, headers), data = grid.slice(headers);
  const cols = grid[0].map((_, ci) => {
    const cnt = {};
    data.forEach(r => { if (r[ci] !== '') cnt[typeOf(r[ci])] = (cnt[typeOf(r[ci])] || 0) + 1; });
    const type = (Object.entries(cnt).sort((a, b) => b[1] - a[1])[0] || ['string'])[0];
    return { label: hdr.map(r => typeof r[ci] === 'string' ? r[ci] : '').filter(Boolean).join(' '), type };
  });
  const rows = data.map(r => ({ c: r.map((v, ci) => {
    if (v === '') return null;
    if (typeOf(v) !== cols[ci].type) return { v: null };
    if (typeOf(v) === 'date') return { v: `Date(${v.y},${v.m - 1},${v.d})`, f: `${v.y}/${v.m}/${v.d}` };
    return { v };
  }) }));
  return { status: 'ok', table: { cols, rows } };
}
// 仿真實主清單：前 6 列是標題雜訊，第 7 列是表頭，欄位順序打亂，最後一列是表尾提示
const GRID = [
  ['板橋收容所遛狗表', '', '', '', '', ''],
  ['', '', '', '', '', ''], ['說明文字', '', '', '', '', ''], ['', '', '', '', '', ''], ['', '', '', '', '', ''], ['', '', '', '', '', ''],
  ['犬名', ' 籠位 ', '編號', '遛狗日期', '備註', '誰遛的'],
  ['宙斯', 'C03', 202101234, D(2026, 9, 16), '', '阿明'],
  ['冬冬', 'A07', 202102345, D(2026, 9, 22), '親人', ''],
  ['比比', 'A08', 202102346, D(2026, 9, 24), '', ''],
  ['金寶', 'A11', '', '', '新狗，原表沒填日期', ''],
  ['', 'A12', 999, D(2026, 9, 1), '犬名空白', ''],
  ['   ', 'A13', 998, D(2026, 9, 1), '犬名只有空白', ''],
  ['舊A01', '', '', '', '', ''],
  ['今天週四', '', '', '', '', ''],
];
const TODAY = new Date(2026, 8, 24, 10);
let INDEX_HTML = ''; // index.html 原始碼，#10 唯讀檢查用（其他測試會替換 fetch，所以先存下來）
let APP_JS = '';     // js/app.js 原始碼（#30 拆檔後程式在這裡）

function runTests() {
  return Promise.all([
    check('找得到表頭列（表頭在第 7 列）', () => {
      eq(findHeaderRow(fakeGviz(GRID, 0).table), 6);
    }),
    check('headers=0 時「編號」「遛狗日期」表頭會被吃掉（重現原本的 bug）', () => {
      const labels = fakeGviz(GRID, 0).table.rows[6].c.map(cellText);
      eq(labels[2], '', '編號表頭：'); eq(labels[3], '', '遛狗日期表頭：');
    }),
    check('headers=7 重讀後六個欄位都對得到，欄位順序打亂也可以', () => {
      const dogs = parseMainList(fakeGviz(GRID, 7).table, [], TODAY);
      eq(dogs[0], { cage: 'C03', id: '202101234', name: '宙斯', walkedDate: dogs[0].walkedDate, walker: '阿明', note: '' });
      eq(ymd(dogs[0].walkedDate), '2026/9/16');
    }),
    check('犬名空白、只有空白、表尾提示（沒有籠位）都不算狗', () => {
      const names = parseMainList(fakeGviz(GRID, 7).table, [], TODAY).map(d => d.name);
      eq(names, ['宙斯', '冬冬', '比比', '金寶']);
    }),
    check('原表本來就空白的日期和編號，讀出來是空的（不是讀取遺失）', () => {
      const kim = parseMainList(fakeGviz(GRID, 7).table, [], TODAY).find(d => d.name === '金寶');
      eq(kim.walkedDate, null); eq(kim.id, '');
    }),
    check('缺必要欄位時顯示錯誤，不會靜默讀錯', () => {
      const grid = GRID.map(r => r.slice(0, 3)); // 只剩犬名、籠位、編號
      let msg = '';
      try { parseMainList(fakeGviz(grid, 7).table, [], TODAY); } catch (e) { msg = e.message; }
      if (!msg.includes('遛狗日期') || !msg.includes('誰遛的') || !msg.includes('備註')) throw new Error(`錯誤訊息沒列出缺的欄位：「${msg}」`);
    }),
    check('欄位標題缺漏時，用第一次讀到的表頭列補', () => {
      const table = fakeGviz(GRID, 7).table;
      table.cols[3].label = '';
      const headerTexts = ['犬名', '籠位', '編號', '遛狗日期', '備註', '誰遛的'];
      eq(ymd(parseMainList(table, headerTexts, TODAY)[0].walkedDate), '2026/9/16');
    }),
    check('主清單分兩次讀：先 headers=0，再 headers=7', async () => {
      const calls = [];
      const realFetch = window.fetch;
      window.fetch = async url => {
        const u = new URL(url);
        const h = +u.searchParams.get('headers');
        calls.push(`${u.searchParams.get('sheet')}:${h}`);
        return new Response(`/*O_o*/\ngoogle.visualization.Query.setResponse(${JSON.stringify(fakeGviz(GRID, h))});`);
      };
      try {
        const dogs = await loadMainList();
        eq(calls, ['主清單:0', '主清單:7']);
        eq(dogs.length, 4);
      } finally { window.fetch = realFetch; }
    }),
    check('日期格式：Date(...)、各種文字寫法、民國年、沒寫年份', () => {
      eq(ymd(cellDate({ v: 'Date(2026,8,16)' }, TODAY)), '2026/9/16');
      eq(ymd(cellDate({ v: '2026/9/1' }, TODAY)), '2026/9/1');
      eq(ymd(cellDate({ v: '2026-09-01' }, TODAY)), '2026/9/1');
      eq(ymd(cellDate({ v: '2026.9.1' }, TODAY)), '2026/9/1');
      eq(ymd(cellDate({ v: '2026年9月1日' }, TODAY)), '2026/9/1');
      eq(ymd(cellDate({ v: '115/9/1' }, TODAY)), '2026/9/1');
      eq(ymd(cellDate({ v: '9/1' }, TODAY)), '2026/9/1');
      eq(ymd(cellDate({ v: '12/28' }, TODAY)), '2025/12/28', '沒寫年份又落在未來時算去年：');
      eq(ymd(cellDate({ v: 46266 }, TODAY)), '2026/9/1', '試算表日期序號：');
    }),
    check('不存在或不合理的日期回空值', () => {
      eq(cellDate({ v: 'Date(2026,1,30)' }, TODAY), null);
      eq(cellDate({ v: '2026/2/30' }, TODAY), null);
      eq(cellDate({ v: '2026/9/100' }, TODAY), null);
      eq(cellDate({ v: '不詳' }, TODAY), null);
      eq(cellDate(null, TODAY), null);
    }),
    check('常遛狗群只保留主清單上有的狗，不列自己、不重複', () => {
      const table = { cols: [{}, {}], rows: [
        { c: [{ v: '宙斯' }, { v: '冬冬' }] }, { c: [{ v: '比比' }, { v: '已離所' }] }, { c: [{ v: '1' }, { v: '冬冬' }] }, { c: [{ v: '宙斯' }, null] },
      ] };
      const map = parseGroups(table, new Set(['宙斯', '冬冬', '比比']));
      eq([...map['宙斯']], ['比比']); eq([...map['冬冬']], []); eq(map['已離所'], undefined);
    }),
    check('近期已遛：只列 0～7 天內遛過的狗，由近到遠，未來日期不列入', () => {
      const dog = (name, date, walker = '') => ({ name, walkedDate: date, walker, note: '' });
      const dogs = [
        dog('七天前', new Date(2026, 8, 17)),
        dog('今天', new Date(2026, 8, 24)),
        dog('八天前', new Date(2026, 8, 16)),
        dog('三天前', new Date(2026, 8, 21)),
        dog('明天', new Date(2026, 8, 25)),
        dog('2099年', new Date(2099, 0, 1)),
        dog('沒日期', null),
        dog('有人固定照顧', null, '阿明'),
      ];
      eq(recentDogs(dogs, TODAY).map(d => d.name), ['今天', '三天前', '七天前']);
      eq(recentDogs([], TODAY), []);
    }),
    check('未來日期顯示「日期異常」，不顯示負的天數', () => {
      const badge = statusBadge({ name: 'x', walkedDate: new Date(2099, 0, 1), walker: '', note: '' }, TODAY);
      if (!badge.includes('日期異常') || badge.includes('-')) throw new Error(`標籤是 ${badge}`);
    }),
    // #8 可一起遛
    check('一隻狗在多組時，可一起遛的名單合併去重', () => {
      const table = { cols: [{}, {}, {}], rows: [
        { c: [{ v: '宙斯' }, { v: '宙斯' }, { v: '冬冬' }] },
        { c: [{ v: '冬冬' }, { v: '比比' }, { v: '金寶' }] },
        { c: [null, { v: '冬冬' }, null] },
      ] };
      const map = parseGroups(table, new Set(['宙斯', '冬冬', '比比', '金寶']));
      eq([...map['宙斯']].sort(), ['冬冬', '比比'].sort());
      eq([...map['冬冬']].sort(), ['宙斯', '比比', '金寶'].sort());
      eq([...map['金寶']], ['冬冬']);
    }),
    check('常遛狗群犬名多了空白（含全形空白）也對得到，顯示用主清單的寫法', () => {
      const table = { cols: [{}], rows: [{ c: [{ v: '宙 斯' }] }, { c: [{ v: '冬\u3000冬 ' }] }] };
      const map = parseGroups(table, new Set(['宙斯', '冬冬']));
      eq([...map['宙斯']], ['冬冬']); eq([...map['冬冬']], ['宙斯']);
    }),
    check('卡片顯示「可一起遛：A、B」；沒有同籠狗或只剩離所狗時不顯示', () => {
      allDogs = [{ name: '宙斯' }, { name: '冬冬' }, { name: '比比' }, { name: '金寶' }];
      groupMap = parseGroups({ cols: [{}, {}], rows: [
        { c: [{ v: '宙斯' }, { v: '金寶' }] }, { c: [{ v: '冬冬' }, { v: '已離所' }] }, { c: [{ v: '比比' }, null] },
      ] }, new Set(allDogs.map(d => d.name)));
      eq([...groupMap['宙斯']], ['冬冬', '比比'], '宙斯：');
      eq([...(groupMap['金寶'] || [])], [], '金寶的同組只有離所的狗：');
      eq(groupMap['沒分組'], undefined, '沒有分組的狗：');
    }),
    check('勿溜：異體字也算，住院不算', () => {
      eq(specialFlag('勿遛，散步時勿溜太久'), { keywords: ['勿溜'], terms: ['勿溜', '勿遛'] });
      eq(specialFlag('住院區，胸背帶放住院'), null);
      eq(specialFlag('親人，好牽'), null);
      eq(specialFlag(''), null);
    }),
    check('勿溜：備註裡每個命中的字眼都標出來，其他文字照樣跳脫', () => {
      const note = '勿溜<先問>，下午再勿遛';
      eq(highlightNote(note, specialFlag(note).terms), '<mark>勿溜</mark>&lt;先問&gt;，下午再<mark>勿遛</mark>');
    }),
    check('勿溜的狗仍留在待巡房與近期已遛，卡片有天數和備註原文；沒有特殊狀況分頁', () => {
      allDogs = [
        { cage: '住院區', id: '1', name: '測試甲', walkedDate: new Date(), walker: '', note: '住院' },
        { cage: 'A02', id: '2', name: '測試乙', walkedDate: new Date(), walker: '', note: '' },
        { cage: 'A03', id: '3', name: '測試丙', walkedDate: new Date(), walker: '', note: '勿遛' },
      ];
      groupMap = { '測試丙': new Set(['測試乙']) }; detailMap = { '3': '個性親人' }; cages = ['住院區', 'A02', 'A03'];
      searchQuery = ''; activeCage = null;
      const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.textContent).sort();
      activeTab = 'due'; renderMain(); eq(names(), ['測試甲', '測試乙', '測試丙'].sort(), '待巡房：');
      activeTab = 'recent'; renderMain(); eq(names(), ['測試甲', '測試乙', '測試丙'].sort(), '近期已遛：');
      eq([...document.querySelectorAll('#tabs button')].map(b => b.dataset.tab), ['due', 'recent', 'cage'], '分頁：');
      const cards = [...document.querySelectorAll('#main .card')];
      const card = n => cards.find(c => c.querySelector('.name').textContent === n);
      if (card('測試甲').querySelector('.warn-note')) throw new Error('住院區的測試甲不該有警示');
      const hei = card('測試丙');
      if (!hei.querySelector('.warn-note') || !hei.querySelector('.last .val.sage')) throw new Error('測試丙要有天數和警示備註');
      eq(hei.querySelector('.warn-note .text').innerHTML, '<mark>勿遛</mark>', '備註：');
      searchQuery = '測試丙'; renderMain();
      if (!document.querySelector('#main .card .warn-note')) throw new Error('搜尋結果沒有警示備註');
      searchQuery = '';
    }),
    // ── #9 照片與介紹 ──
    check('介紹：去掉 YAML frontmatter，只留內文', () => {
      eq(parseFrontmatterBody('---\nname: 宙斯\ntags: [親人]\n---\n\n很黏人。\n'), '很黏人。');
      eq(parseFrontmatterBody('\uFEFF---\r\nname: 宙斯\r\n---\r\n很黏人。'), '很黏人。', 'BOM 與 Windows 換行：');
      eq(parseFrontmatterBody('沒有 frontmatter 的介紹'), '沒有 frontmatter 的介紹');
      eq(parseFrontmatterBody('第一段\n\n---\n\n第二段'), '第一段\n\n---\n\n第二段', '內文中的分隔線不算 frontmatter：');
    }),
    check('介紹：Markdown 符號不原樣露出', () => {
      const md = '# 宙斯\n\n**很親人**，喜歡 *散步*。\n\n- 怕機車\n- 會拉扯\n\n> 小心 __別的公狗__\n\n[領養頁](https://example.com) [[冬冬|好朋友冬冬]] ![照片](a.jpg) `暗號`\n\n---\n\n| 項目 | 說明 |\n|---|---|\n| 體重 | 20kg |';
      const text = markdownToText(md);
      eq(text, '宙斯 很親人，喜歡 散步。 怕機車 會拉扯 小心 別的公狗 領養頁 好朋友冬冬  暗號 項目 說明 體重 20kg');
      if (/[*#`\[\]|>]/.test(text)) throw new Error(`還有 Markdown 符號：「${text}」`);
    }),
    check('介紹：底線在字中間（如 dog_01）不會被吃掉', () => {
      eq(markdownToText('檔名 dog_01_a 保留'), '檔名 dog_01_a 保留');
    }),
    check('介紹：用編號抓 dogs/{編號}.md，404 安靜略過，沒編號不抓、同編號只抓一次', async () => {
      // 其他測試可能同時換掉 fetch：不是 dogs/ 的請求交回給原本的 fetch
      const calls = [];
      const prevFetch = window.fetch;
      const fakeFetch = async url => {
        if (!String(url).startsWith('dogs/')) return prevFetch(url);
        calls.push(String(url));
        if (url === 'dogs/202101234.md') return new Response('---\nname: 宙斯\n---\n**很親人**');
        if (url === 'dogs/202102345.md') throw new TypeError('Failed to fetch');
        return new Response('Not Found', { status: 404 });
      };
      window.fetch = fakeFetch;
      try {
        const map = await fetchAllDetails([
          { name: '宙斯', id: '202101234' }, { name: '宙斯二號', id: '202101234' },
          { name: '冬冬', id: '202102345' }, { name: '比比', id: '202102346' }, { name: '金寶', id: '' },
        ]);
        eq(map, { 202101234: '很親人' });
        eq(calls.sort(), ['dogs/202101234.md', 'dogs/202102345.md', 'dogs/202102346.md']);
      } finally { if (window.fetch === fakeFetch) window.fetch = prevFetch; }
    }),
    check('照片：有編號用 photos/{編號}.jpg 縮圖且延後載入；沒編號直接顯示腳掌、不抓 photos/.jpg', () => {
      const box = document.createElement('div');
      box.innerHTML = photoThumb({ name: '宙斯', id: '202101234' });
      const img = box.querySelector('img');
      eq(img.getAttribute('src'), 'photos/202101234.jpg');
      eq(img.getAttribute('loading'), 'lazy');
      box.innerHTML = photoThumb({ name: '金寶', id: '' });
      eq(box.querySelector('img'), null, '沒編號時的 img：');
      if (!box.querySelector('.thumb-fallback')) throw new Error('沒編號時沒有腳掌圖示');
    }),
    check('詳細資訊：抓到介紹才顯示在狗卡資訊，沒編號的狗不顯示', () => {
      const saved = detailMap;
      const intro = dog => {
        const box = document.createElement('div');
        box.innerHTML = detailHtml(dog, TODAY);
        return box.querySelector('[data-section="intro"] .content');
      };
      try {
        detailMap = { 202101234: '很親人' };
        eq(intro({ name: '宙斯', id: '202101234', cage: 'C03', walkedDate: null, walker: '', note: '' }).textContent, '很親人');
        eq(intro({ name: '比比', id: '202102346', cage: 'A08', walkedDate: null, walker: '', note: '' }), null, '沒介紹檔：');
        detailMap = { '': '不該出現' };
        eq(intro({ name: '金寶', id: '', cage: 'A11', walkedDate: null, walker: '', note: '' }), null, '沒編號：');
      } finally { detailMap = saved; }
    }),
    // ── #7 搜尋 ──
    check('搜尋：犬名部分符合即可，忽略空白、全形與大小寫', () => {
      const dog = { name: '測試 Lucky 丁' };
      eq(matchesSearch(dog, '試'), true);
      eq(matchesSearch(dog, 'lucky'), true, '大小寫：');
      eq(matchesSearch(dog, 'ＬＵＣＫＹ丁'), true, '全形、空白：');
      eq(matchesSearch(dog, '  '), true, '只有空白當作沒搜尋：');
      eq(matchesSearch(dog, '測試戊'), false);
    }),
    check('搜尋：只篩選目前分頁，分頁數字跟著變，清空回到原本內容', () => {
      const daysAgo = n => new Date(Date.now() - n * 86400000);
      allDogs = [
        { cage: 'B01', id: '', name: '搜尋甲', walkedDate: daysAgo(1), walker: '', note: '' },
        { cage: 'B02', id: '', name: '搜尋乙', walkedDate: daysAgo(20), walker: '', note: '勿溜' },
        { cage: 'B02', id: '', name: '別隻丙', walkedDate: daysAgo(2), walker: '', note: '' },
      ];
      groupMap = {}; detailMap = {}; cages = ['B01', 'B02']; activeCage = null;
      const names = () => [...document.querySelectorAll('#main .card .name')].map(n => n.textContent);
      const counts = () => [...document.querySelectorAll('#tabs button .n')].map(n => n.textContent);
      const mainText = () => document.getElementById('main').textContent;
      try {
        searchQuery = '搜尋';
        activeTab = 'due'; renderMain();
        eq(names(), ['搜尋乙', '搜尋甲'], '待巡房（久沒遛的在前）：');
        eq(counts(), ['2', '1', '2 區'], '分頁數字：');
        if (!mainText().includes('搜尋「搜尋」：2 隻')) throw new Error('沒有顯示搜尋結果隻數');

        eq(names(), ['搜尋乙', '搜尋甲'], '依籠位直接列出符合的狗：');

        eq(names(), [], '近期已遛沒有乙：');
        if (!mainText().includes('近期已遛裡沒有「乙」') || !mainText().includes('待巡房有 1 隻'))
          throw new Error(`沒提示去待巡房找：${mainText()}`);

    check('搜尋：輸入即篩選；注音選字途中不篩選，選好字才更新', () => {

    check('籠位清單從主清單籠位欄去重：空籠也列出，表尾提示不算', () => {

    check('#3 色標邊界：0～6 天綠、第 7 天起黃、第 30 天起紅', () => {
      const daysAgo = n => ({ name: '測試狗', walkedDate: new Date(2026, 8, 24 - n), walker: '' });

    check('#3 待巡房排序：沒紀錄最前，再由久到近，有人固定照顧最後；所有狗都在', () => {
      const d = (name, n, walker = '') => ({ name, walkedDate: n == null ? null : new Date(2026, 8, 24 - n), walker });

    check('#10 唯讀：除搜尋框外沒有輸入框、勾選框、可編輯區塊；搜尋框有放大鏡與提示文字', () => {
      const doc = new DOMParser().parseFromString(INDEX_HTML, 'text/html');
      const inputs = [...doc.querySelectorAll('input, textarea, select, [contenteditable]')];
      eq(inputs.map(el => el.id), ['searchInput'], '可輸入元素：');
      const box = inputs[0];
      eq(box.type, 'search', '搜尋框型別：');
      eq(box.placeholder, '搜尋犬名', '提示文字：');
      if (!box.parentElement.querySelector('use[href="#i-search"]')) throw new Error('搜尋框旁要有放大鏡圖示');
      if (doc.querySelector('form')) throw new Error('頁面不應有表單');
      const symbols = [...doc.querySelectorAll('symbol')].map(el => el.id).join(' ');
      // #28 起卡片可以點開詳細資訊，所以允許右箭頭（chevron）；編輯、勾選圖示仍不行
      if (/edit|pencil|pen|check/i.test(symbols)) throw new Error(`不應有編輯或勾選圖示：${symbols}`);
    }),
    check('#10 唯讀：程式只有讀取，沒有寫入試算表的呼叫', () => {
      const code = APP_JS;
      const bad = [/method\s*:/i, /\bPOST\b|\bPUT\b|\bPATCH\b|\bDELETE\b/, /script\.google\.com|macros\/s\//, /sheets\.googleapis\.com/,
        /appendRow|setValue|batchUpdate|XMLHttpRequest|sendBeacon|localStorage|indexedDB/];
      const hits = bad.filter(re => re.test(code)).map(String);
      eq(hits, [], '寫入相關字眼：');
      const urls = [...code.matchAll(/fetch\(([^)]*)\)/g)].map(m => m[1].trim());
      eq(urls.length, 2, 'fetch 呼叫數：');
      if (!urls.every(u => u === 'url' || u.startsWith('`dogs/'))) throw new Error(`只能讀 gviz 與 dogs/：${urls.join('、')}`);
    }),
    check('#10／#28 卡片沒有連結，也不會跳到別頁（點了只開詳細資訊）', () => {
      const box = document.createElement('div');
      box.innerHTML = dogCard({ name: '測試狗', cage: 'A01', id: '1', walkedDate: null, walker: '', note: '勿溜' }, TODAY);
      if (box.querySelector('a, [onclick], [href]:not(use)')) throw new Error('卡片裡不應有連結');
    }),
    check('#10 試算表文字一律跳脫：備註、犬名、籠位、編號、可一起遛、搜尋字', () => {
      const evil = '<img src=x onerror="window.__xss=1"><b>粗</b>&amp;';
      const dog = { name: evil, cage: evil, id: evil, walkedDate: null, walker: '', note: evil + '勿溜' };
      const saved = [groupMap, detailMap, allDogs, cages, activeTab, activeCage, searchQuery];
      try {
        groupMap = { [evil]: new Set([evil]) };
        detailMap = { [evil]: evil };
        const box = document.createElement('div');
        box.innerHTML = dogCard(dog, TODAY);
        eq(box.querySelectorAll('.body img, .body b').length, 0, '卡片裡被當成 HTML 的元素：');
        eq(box.querySelector('.name').textContent, evil, '犬名原文：');
        if (!box.querySelector('.warn-note .text').textContent.startsWith(evil)) throw new Error('備註要原樣顯示文字');
        box.innerHTML = detailHtml(dog, TODAY);
        eq(box.querySelectorAll('.info img, section img:not(.thumb img), section b').length, 0, '詳細資訊裡被當成 HTML 的元素：');
        eq(box.querySelector('.buddy .bname').textContent, evil, '可一起遛原文：');
        eq(box.querySelector('[data-section="intro"] .content').textContent, evil, '狗卡資訊原文：');
        allDogs = [dog]; cages = [evil]; activeTab = 'cage'; activeCage = null; searchQuery = '';
        render();
        eq(document.querySelector('#main .cage-chip').dataset.cage, evil, '籠位按鈕：');
        document.querySelector('#main .cage-chip').click();
        eq(document.querySelectorAll('#main img:not(.thumb img)').length, 0, '籠內頁被當成 HTML 的圖片：');

        searchQuery = '<i>沒有這隻</i>'; render();
        if (document.querySelector('#main i')) throw new Error('搜尋字不應被當成 HTML');
        if (window.__xss) throw new Error('跳脫失敗，執行了試算表裡的程式');

        [groupMap, detailMap, allDogs, cages, activeTab, activeCage, searchQuery] = saved;
        render();
      }
    }),
    // ── #28 卡片高密度化與詳細資訊 ──
    check('#28 警示關鍵字：勿溜、不要、攻擊、不親狗、不親任一命中就算，原文不改', () => {
      const hit = note => { const f = specialFlag(note); return f ? f.keywords : null; };

      eq(hit('會攻擊黑色狗'), ['攻擊']);
      eq(hit('不要跟小白一起遛'), ['不要']);
      eq(hit('勿溜，治療中'), ['勿溜']);
      eq(hit('勿蹓'), ['勿溜'], '舊有異體字照樣算：');

      for (const note of ['不親狗，請單獨遛', '會攻擊黑色狗', '不要跟小白一起遛', '勿溜，治療中']) {

    check('#28 同一筆備註命中多個關鍵字只顯示一次，字眼都標出來；也沒有固定文案的警示徽章', () => {

    check('#28 卡片第一層：照片、犬名、性別位置、上次遛狗、編號｜籠位同一行；一般備註只有小圖示，可一起遛、狗卡資訊不攤開', () => {

        const dog = { name: '測試狗', cage: 'A01', id: '1', walkedDate: new Date(2026, 8, 24), walker: '', note: '親人，好牽' };

    check('#28 上次遛狗：今天／幾天前／尚無紀錄／有人固定照顧，天數顏色照色標', () => {

      eq(val({ walkedDate: new Date(2026, 8, 24), walker: '' }), ['今天', 'val sage']);

    check('#28 詳細資訊分成備註、可以一起溜的狗（照片＋犬名）、狗卡資訊三區', () => {

        const dog = { name: '測試狗', cage: 'A01', id: '1', walkedDate: null, walker: '', note: '親人，好牽\n怕機車' };
        allDogs = [dog, { name: '好朋友', cage: 'A02', id: '2', walkedDate: null, walker: '', note: '' }];
        groupMap = { '測試狗': new Set(['好朋友']) }; detailMap = { 1: '入所狗卡' };
        const box = document.createElement('div');
        box.innerHTML = detailHtml(dog, TODAY);
        eq([...box.querySelectorAll('section h3')].map(h => h.firstChild.nextSibling.textContent), ['備註', '可以一起溜的狗', '狗卡資訊']);
        eq(box.querySelector('[data-section="note"] .content').textContent, '親人，好牽\n怕機車', '備註原文：');
        const buddy = box.querySelector('.buddy');
        eq(buddy.querySelector('img').getAttribute('src'), 'photos/2.jpg', '一起溜的照片：');
        eq(buddy.querySelector('.bname').textContent, '好朋友');
        eq(box.querySelector('[data-section="intro"] .content').textContent, '入所狗卡');
        dog.note = ''; groupMap = {}; detailMap = {};
        box.innerHTML = detailHtml(dog, TODAY);
        eq([...box.querySelectorAll('section .empty')].length, 3, '都沒有資料時顯示提示：');
      } finally { [allDogs, groupMap, detailMap] = saved; }
    }),
    check('#28 點狗卡開詳細資訊，點一起溜的狗換成那隻，關閉後回到清單', () => {
      const saved = [allDogs, groupMap, detailMap, cages, activeTab, activeCage, searchQuery];
      try {
        allDogs = [
          { name: '測試甲', cage: 'A01', id: '1', walkedDate: null, walker: '', note: '' },
          { name: '測試乙', cage: 'A02', id: '2', walkedDate: null, walker: '', note: '' },
        ];
        groupMap = { '測試甲': new Set(['測試乙']), '測試乙': new Set(['測試甲']) }; detailMap = {};
        cages = ['A01', 'A02']; activeTab = 'due'; activeCage = null; searchQuery = '';
        renderMain();
        const before = [...document.querySelectorAll('#main .card .name')].map(n => n.textContent);
        document.querySelector('#main .card[data-dog="0"] .name').click();
        eq(document.getElementById('detailBackdrop').hidden, false, '開啟：');
        eq(document.getElementById('detailName').firstChild.textContent, '測試甲');
        document.querySelector('#detail .buddy').click();
        eq(document.getElementById('detailName').firstChild.textContent, '測試乙', '換成一起溜的狗：');
        hideDetail();
        eq(document.getElementById('detailBackdrop').hidden, true, '關閉：');
        eq([...document.querySelectorAll('#main .card .name')].map(n => n.textContent), before, '清單不變：');
        document.querySelector('#main .card[data-dog="1"]').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        eq(document.getElementById('detailName').firstChild.textContent, '測試乙', '鍵盤 Enter 也能開：');
        hideDetail();
      } finally {
        hideDetail();
        if (history.state && history.state.bqDetail) history.replaceState(null, '');
        [allDogs, groupMap, detailMap, cages, activeTab, activeCage, searchQuery] = saved;
      }
    }),
    check('#30 檔案拆分：index.html 只有結構，樣式在 css/app.css、程式在 js/app.js', () => {
      const doc = new DOMParser().parseFromString(INDEX_HTML, 'text/html');
      if (doc.querySelector('style')) throw new Error('index.html 不應再有 <style>');
      const scripts = [...doc.querySelectorAll('script')];
      eq(scripts.map(s => s.getAttribute('src')), ['js/app.js'], 'script：');
      if (scripts.some(s => s.textContent.trim())) throw new Error('index.html 不應有內嵌程式');
      if (!doc.querySelector('link[rel="stylesheet"][href="css/app.css"]')) throw new Error('要載入 css/app.css');
      if (doc.querySelector('#main .card')) throw new Error('狗狗資料不應寫死在 index.html');
    }),
  ]);
}

function show() {
  const failed = results.filter(r => !r.ok);
  const summary = document.getElementById('summary');
  summary.textContent = failed.length ? `${failed.length} 項失敗，${results.length - failed.length} 項通過` : `全部 ${results.length} 項通過`;
  summary.className = failed.length ? 'fail' : 'pass';
  document.getElementById('results').innerHTML = results.map(r =>
    `<li class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${esc(r.name)}${r.ok ? '' : `<br>${esc(r.msg)}`}</li>`).join('');
}

// 讀進 index.html（結構檢查用）與 js/app.js 後執行程式，函式就能在這頁直接呼叫
Promise.all(['../index.html', '../js/app.js'].map(u => fetch(u).then(res => {
  if (!res.ok) throw new Error(`讀不到 ${u}（HTTP ${res.status}）`);
  return res.text();
})))
  .then(([html, js]) => {
    INDEX_HTML = html;
    APP_JS = js;
    const s = document.createElement('script');
    s.textContent = js;
    document.body.appendChild(s);
    return runTests();
  })
  .then(show)
  .catch(e => {
    document.getElementById('summary').textContent = `測試頁載入失敗：${e.message}（請用網址開啟，不要直接雙擊檔案）`;
    document.getElementById('summary').className = 'fail';
  });
</script>
