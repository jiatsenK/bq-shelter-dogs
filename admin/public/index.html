<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>狗資料 · 板收管理網站</title>
  <link rel="stylesheet" href="./vendor/tabler.min.css">
  <link rel="stylesheet" href="./admin.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到狗資料</a>
  <div class="admin-layout">
    <aside class="admin-sidebar" aria-label="管理網站">
      <a class="brand" href="./">板收<span>管理網站</span></a>
      <nav aria-label="管理功能">
        <a class="nav-item active" href="./" aria-current="page">狗資料</a>
        <span class="nav-item future" aria-disabled="true">功能管理<small>後續開放</small></span>
        <span class="nav-item future" aria-disabled="true">活動紀錄<small>後續開放</small></span>
        <span class="nav-item future" aria-disabled="true">資料檢查<small>後續開放</small></span>
        <span class="nav-item future" aria-disabled="true">更新紀錄<small>後續開放</small></span>
      </nav>
      <p class="sidebar-note">管理者<br><span>第一階段 · 唯讀查詢</span></p>
    </aside>
    <main id="content" class="admin-content" tabindex="-1">
      <header class="admin-page-header">
        <div><h1>狗資料</h1><p>查看狗的身分與維護狀態。</p></div>
        <button type="button" class="btn btn-primary" id="refresh">重新讀取</button>
      </header>
      <section class="source-note" aria-label="資料來源說明">
        <strong>目前僅供查詢</strong>　編號、狗名、籠位、備註由試算表送入；介紹、休養與固定照顧由網站維護。性別暫沿用既有顯示，有差異會另行標示。
      </section>
      <section class="card" aria-label="狗資料表">
        <form class="table-filters" id="filters" role="search">
          <div class="search-field"><label class="form-label" for="query">搜尋狗資料</label><input class="form-control" id="query" type="search" placeholder="狗名、編號、籠位、介紹或永久 ID" maxlength="200" autocomplete="off"></div>
          <div><label class="form-label" for="presence">名單</label><select class="form-select" id="presence"><option value="all">全部</option><option value="main">主清單上</option><option value="other">未列主清單</option></select></div>
          <div><label class="form-label" for="sex">性別</label><select class="form-select" id="sex"><option value="">全部</option><option value="male">公</option><option value="female">母</option><option value="unknown">待確認</option></select></div>
          <div><label class="form-label" for="care">維護狀態</label><select class="form-select" id="care"><option value="">全部</option><option value="missing">有待補資料</option><option value="rest">休養中</option><option value="fixed">固定照顧</option></select></div>
          <button class="btn" id="clear" type="reset">清除條件</button>
        </form>
        <div id="status" class="table-status" role="status" aria-live="polite">正在讀取狗資料…</div>
        <div class="table-responsive" tabindex="0" role="region" aria-label="狗資料，可水平捲動" id="table-region" hidden>
          <table class="table table-vcenter">
            <caption class="visually-hidden">狗的永久身分與資料來源。點選欄名切換排序。</caption>
            <thead><tr>
              <th scope="col">照片</th>
              <th scope="col" aria-sort="ascending"><button type="button" data-sort="number">目前編號<span class="source-label">試算表</span></button></th>
              <th scope="col"><button type="button" data-sort="name">狗名<span class="source-label">試算表</span></button></th>
              <th scope="col"><button type="button" data-sort="cage">籠位<span class="source-label">試算表</span></button></th>
              <th scope="col"><button type="button" data-sort="sex">性別</button></th>
              <th scope="col">介紹／備註</th><th scope="col">維護狀態</th>
              <th scope="col"><button type="button" data-sort="dogId">永久 ID</button></th>
            </tr></thead>
            <tbody id="dogs"></tbody>
          </table>
        </div>
        <footer class="table-footer" id="pagination" hidden>
          <span id="count"></span>
          <label class="page-size" for="page-size">每頁<select id="page-size" class="form-select"><option>25</option><option>50</option><option>100</option></select>隻</label>
          <div class="page-controls"><button type="button" class="btn" id="previous">上一頁</button><span id="page-number"></span><button type="button" class="btn" id="next">下一頁</button></div>
        </footer>
      </section>
      <p class="data-note">「未列主清單」僅表示目前不在試算表主清單，不能據此判定離所。缺照片依照片紀錄判斷，實際檔案讀不到時會另外提示。</p>
    </main>
  </div>
</body>
</html>
