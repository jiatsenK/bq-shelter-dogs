<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資料流 · 板收管理網站</title>
  <link rel="stylesheet" href="./vendor/tabler.min.css">
  <link rel="stylesheet" href="./admin.css">
  <script type="module" src="./js/flow.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到資料流</a>
  <div class="admin-layout">
    <aside class="admin-sidebar" aria-label="管理網站">
      <a class="brand" href="./">板收<span>管理網站</span></a>
      <nav aria-label="管理功能">
        <div class="nav-group" role="group" aria-labelledby="nav-data">
          <p class="nav-heading" id="nav-data">資料</p>
          <a class="nav-item" href="./">狗資料</a>
          <a class="nav-item" href="./activities.html">活動紀錄</a>
          <a class="nav-item" href="./checks.html">待補清單</a>
          <a class="nav-item active" href="./flow.html" aria-current="page">資料流</a>
        </div>
        <div class="nav-group" role="group" aria-labelledby="nav-volunteer">
          <p class="nav-heading" id="nav-volunteer">志工網站</p>
          <a class="nav-item" href="./settings.html">志工網站設定</a>
          <a class="nav-item" href="./updates.html">修改紀錄</a>
          <a class="nav-item" href="./releases.html">網站更新</a>
          <a class="nav-item" href="./links.html">網站連結</a>
        </div>
      </nav>
    </aside>
    <main id="content" class="admin-content" tabindex="-1">
      <header class="admin-page-header">
        <div><h1>資料流</h1><p>資料在哪、往哪裡送、現在有沒有卡住。這頁只讀，不改任何資料。</p></div>
        <button type="button" class="btn" id="reload">重新讀取</button>
      </header>
      <div class="flow-tabs" role="group" aria-label="切換圖">
        <button type="button" class="btn" data-view-tab="flow" aria-pressed="true">資料流向</button>
        <button type="button" class="btn" data-view-tab="chain" aria-pressed="false">網站登記傳輸鏈</button>
      </div>
      <p id="flow-status" class="check-status" role="status" aria-live="polite">正在讀取狀態…</p>
      <div class="flow-layout">
        <section class="card flow-card" aria-labelledby="flow-intro">
          <p id="flow-intro" class="flow-intro"></p>
          <p class="flow-scroll-hint">圖比畫面寬，左右滑動看整張圖。</p>
          <div class="flow-graph" id="flow-graph" tabindex="0" aria-label="節點圖，可水平捲動">
            <svg class="flow-wires" id="flow-wires" aria-hidden="true"></svg>
            <div class="flow-grid" id="flow-grid"></div>
            <svg class="flow-wires flow-labels" id="flow-labels" aria-hidden="true"></svg>
          </div>
        </section>
        <aside class="card flow-detail" id="flow-detail" aria-live="polite"></aside>
      </div>
      <p class="data-note">燈號來源：寫回、衝突、寫入預算讀志工網站的 D1；排程讀每次跑完留下的紀錄；狗清單保險掃描讀 Apps Script 最後一次送來的掃描時間。Apps Script 自己的執行紀錄（有沒有送不出去的改表通知）這裡看不到，要到 Apps Script「執行作業」看。</p>
    </main>
  </div>
</body>
</html>
