<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>志工溜狗表 環境與部署</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif TC', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .note {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--color-muted);
    }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Deployment · bq-shelter-dogs</p>
    <h1>志工溜狗表 環境與部署</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="environments-title environments-desc">

        <desc id="environments-desc">正式環境有志工網站與管理網站兩個 Worker，共用正式 D1 與 R2；測試網站與 PR 預覽共用測試 D1 與 R2；只有志工網站與測試網站連試算表，seed 會把正式 D1 整份複製到測試 D1。</desc>
        <defs>
          <style>
            .n  { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
            .s  { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
            .zh { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; fill: #4f5d75; text-anchor: middle; }
            .t  { font-family: 'Geist Mono', monospace; font-size: 7px; text-anchor: middle; letter-spacing: 0.08em; }

            .am { font-family: 'Geist Mono', monospace; font-size: 8px; text-anchor: middle; letter-spacing: 0.08em; }
            .z  { font-family: 'Geist Mono', monospace; font-size: 7px; fill: rgba(45,49,66,0.40); letter-spacing: 0.14em; }
            .lg { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; fill: #4f5d75; }
            .cb { font-family: 'Instrument Serif', 'Noto Serif TC', serif; font-style: italic; font-size: 14px; fill: #4f5d75; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <text class="z" x="72" y="381">TEST</text>

        <!-- 正式志工網站 → 正式 D1·R2 -->
        <path d="M 320,168 H 444 Q 452,168 452,176 V 192 Q 452,200 460,200 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 720,264 V 424 a 8,8 0 0,0 0,16 V 448" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
