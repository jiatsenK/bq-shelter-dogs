<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>試算表改動回到 D1</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif TC', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1120px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .note {
      margin-top: 1rem;
      font-size: 0.8rem;
      line-height: 1.6;
      color: var(--color-muted);
    }
    svg { width: 100%; min-width: 1120px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · 寫回與同步</p>
    <h1>試算表改動回到 D1</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1120 952" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sheet-sync-sequence-title sheet-sync-sequence-desc">
        <title id="sheet-sync-sequence-title">試算表改動回到 D1</title>
        <desc id="sheet-sync-sequence-desc">管理者改試算表後，Apps Script 由編輯觸發記下待通知並送給志工網站寫進 D1，收到 ACK 才清掉；另有每天三次的狗清單保險掃描比對指紋補漏。</desc>
        <defs>
          <style>
            .n  { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; text-anchor: middle; }
            .s  { font-family: 'Geist Mono', 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
            .zh { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #4f5d75; text-anchor: middle; }
            .t  { font-family: 'Geist Mono', monospace; font-size: 7px; text-anchor: middle; letter-spacing: 0.08em; }
            .al { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: 500; text-anchor: middle; }
            .am { font-family: 'Geist Mono', monospace; font-size: 8px; text-anchor: middle; letter-spacing: 0.08em; }
            .g  { font-family: 'Geist Mono', 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 10px; fill: #4f5d75; }
            .op { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.12em; }
            .z  { font-family: 'Geist Mono', monospace; font-size: 8px; fill: #4f5d75; letter-spacing: 0.14em; }
            .ln { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 13px; font-weight: 600; fill: #2d3142; }
            .ls { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 11px; fill: #4f5d75; }
            .lg { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; fill: #4f5d75; }
            .cb { font-family: 'Instrument Serif', 'Noto Serif TC', serif; font-style: italic; font-size: 15px; fill: #4f5d75; }
            .ax { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; text-anchor: middle; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
        <!-- Lifelines -->
        <line x1="120" y1="136" x2="120" y2="804" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="340" y1="136" x2="340" y2="804" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="560" y1="136" x2="560" y2="804" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="780" y1="136" x2="780" y2="804" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="1000" y1="136" x2="1000" y2="804" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <!-- Fragments -->
        <rect x="488" y="308" width="584" height="232" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="488" y="308" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text class="op" x="510" y="319">LOOP</text>
        <rect x="496" y="321" width="270" height="14" rx="2" fill="#f5f5f5"/>
        <text class="g" x="500" y="332">[改表後立刻送；沒收到 ACK 就留著，每 10 分鐘補送]</text>
        <rect x="488" y="560" width="584" height="228" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="488" y="560" width="44" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text class="op" x="510" y="571">LOOP</text>
        <rect x="496" y="573" width="359" height="14" rx="2" fill="#f5f5f5"/>
        <text class="g" x="500" y="584">[每天約 09:43、13:53、23:53 狗清單保險掃描，前後可能差 15 分鐘]</text>
        <!-- Messages -->
        <line x1="120" y1="184" x2="338" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="340" y1="228" x2="558" y2="228" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <path d="M 560,260 H 588 Q 596,260 596,268 V 276 Q 596,284 588,284 H 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="380" x2="778" y2="380" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="780" y1="424" x2="998" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="780" y1="468" x2="562" y2="468" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <path d="M 560,492 H 588 Q 596,492 596,500 V 508 Q 596,516 588,516 H 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="560" y1="632" x2="778" y2="632" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="780" y1="676" x2="562" y2="676" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="560" y1="720" x2="778" y2="720" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="780" y1="764" x2="998" y2="764" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Message labels -->
        <rect x="206" y="160" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="230" y="172" fill="#4f5d75">改格子</text>
        <rect x="420" y="204" width="60" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="450" y="216" fill="#4f5d75">編輯觸發</text>
        <rect x="608" y="264" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="644" y="276" fill="#4f5d75">記進待通知</text>
        <rect x="590" y="356" width="160" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="670" y="368" fill="#2e5aa8">送改動 /rows・/dog-list</text>
        <rect x="824" y="400" width="132" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="890" y="412" fill="#4f5d75">收下今日溜狗與狗清單</text>
        <rect x="644" y="444" width="52" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="670" y="456" fill="#eb6c36">回 ACK</text>
        <rect x="608" y="496" width="72" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="644" y="508" fill="#4f5d75">清掉待通知</text>
        <rect x="584" y="608" width="172" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="670" y="620" fill="#2e5aa8">送全表指紋 /dog-list-scan</text>
        <rect x="622" y="652" width="96" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="670" y="664" fill="#4f5d75">回不一樣的單位</text>
        <rect x="606" y="696" width="128" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="670" y="708" fill="#2e5aa8">分批補送 /dog-list</text>
        <rect x="862" y="740" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text class="al" x="890" y="752" fill="#4f5d75">補進 D1</text>
        <!-- Actors -->
        <rect x="36" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="36" y="72" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="44" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text class="t" x="60" y="89" fill="#7a8399">USER</text>
        <text class="n" x="120" y="108">管理者</text>
        <text class="s" x="120" y="123">人工改表</text>
        <rect x="256" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="256" y="72" width="168" height="64" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8" stroke-width="1"/>
        <rect x="264" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.40)" stroke-width="0.8"/>
        <text class="t" x="282" y="89" fill="#2e5aa8">SHEET</text>
        <text class="n" x="340" y="108">Google 試算表</text>
        <text class="s" x="340" y="123">主清單・已出所・常遛狗群</text>
        <rect x="476" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="476" y="72" width="168" height="64" rx="6" fill="rgba(46,90,168,0.06)" stroke="#2e5aa8" stroke-width="1"/>
        <rect x="484" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(46,90,168,0.40)" stroke-width="0.8"/>
        <text class="t" x="498" y="89" fill="#2e5aa8">GAS</text>
        <text class="n" x="560" y="108">Apps Script</text>
        <text class="s" x="560" y="123">編輯觸發・時間觸發</text>
        <rect x="696" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="72" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="704" y="80" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text class="t" x="726" y="89" fill="#4f5d75">WORKER</text>
        <text class="n" x="780" y="108">志工網站</text>
        <text class="s" x="780" y="123">/api/walk-writeback</text>
        <rect x="916" y="72" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="916" y="72" width="168" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="924" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text class="t" x="936" y="89" fill="#eb6c36">D1</text>
        <text class="n" x="1000" y="108">D1</text>
        <text class="s" x="1000" y="123">網站唯一讀取來源</text>
        <!-- Callouts -->
        <text class="cb" x="120" y="832">程式寫表不會觸發編輯觸發：網站新增的備註、異動紀錄，要等下一次保險掃描才進 D1，最久約 10 小時。</text>
        <text class="cb" x="120" y="856">保險掃描只補不刪：D1 有、試算表沒有的，只列在 GAS 紀錄裡。</text>
        <line x1="56" y1="888" x2="1064" y2="888" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text class="z" x="56" y="906">LEGEND</text>
        <rect x="56" y="916" width="16" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text class="lg" x="80" y="928">D1（最後落點）</text>
        <line x1="193" y1="924" x2="221" y2="924" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text class="lg" x="229" y="928">HTTP 呼叫</text>
        <line x1="314" y1="924" x2="342" y2="924" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text class="lg" x="350" y="928">寫入</text>
        <line x1="402" y1="924" x2="430" y2="924" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text class="lg" x="438" y="928">回應</text>
        <line x1="490" y1="924" x2="518" y2="924" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text class="lg" x="526" y="928">觸發、不等回應</text>
        <line x1="638" y1="924" x2="666" y2="924" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <text class="lg" x="674" y="928">ACK 後才清待通知</text>
      </svg>
    </div>
    <p class="note">依程式碼核對（main e8031ed）：apps-script/sheet-write.gs 的 onWalkSheetEdit、flushWalkEdits、flushDogList、dogListScan，worker/src/dog-list.js、worker/src/walk-reconcile.js。今日溜狗走 /rows，狗清單（主清單、已出所、常遛狗群、異動紀錄）走 /dog-list，待通知分別存在 GAS 指令碼屬性 WALK_EDITS_PENDING、DOG_LIST_PENDING。</p>
  </div>
</body>
</html>
