<style>
#plain-walk-history{--bq-shell:#1f5c4d;--bq-bg:#e3e9e5;--bq-paper:#fff;--bq-ink:#16211d;--bq-muted:#4e5e57;--bq-line:#c4cfc9;--bq-gap:8px;--bq-side:20px;--bq-face:clamp(56px,19cqw,74px);--bq-photo:clamp(54px,16cqw,62px);--bq-tile-height:calc(var(--bq-photo) + 42px);--bq-ease:cubic-bezier(.16,1,.3,1);font-family:system-ui,"Microsoft JhengHei",sans-serif;color:var(--bq-ink);max-width:390px;margin:0 auto;container-type:inline-size}
#plain-walk-history *{box-sizing:border-box}
#plain-walk-history button{font:inherit}
#plain-walk-history .bq-screen{background:var(--bq-bg);overflow:hidden}
#plain-walk-history .bq-header{background:var(--bq-shell);color:#fff;padding:16px var(--bq-side)}
#plain-walk-history .bq-brand{font-size:20px;font-weight:800;letter-spacing:.04em;margin:0 0 4px}
#plain-walk-history .bq-date{font-size:12px;color:#b5cfc4;display:flex;justify-content:space-between;gap:8px;line-height:20px}
#plain-walk-history .bq-search{background:var(--bq-paper);color:var(--bq-muted);padding:10px 12px;margin-top:12px;font-size:16px;border-radius:3px;display:flex;gap:8px;align-items:center;min-height:44px}
#plain-walk-history i,#plain-walk-history svg{width:20px;height:20px;display:inline-block;flex-shrink:0}
#plain-walk-history .bq-switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px var(--bq-side) 4px;min-height:60px}
#plain-walk-history .bq-switch>button{display:none}
#plain-walk-history .bq-group-title{font-size:24px;font-weight:800;line-height:32px;margin:0}
#plain-walk-history .bq-group-title small{font-size:13px;font-weight:400;color:var(--bq-muted);margin-left:8px;white-space:nowrap}
#plain-walk-history .bq-add{color:var(--bq-shell);font-size:14px;font-weight:700;white-space:nowrap}
#plain-walk-history .bq-pager{height:24px;display:flex;align-items:start;justify-content:center}
#plain-walk-history .bq-page{display:flex;gap:5px;align-items:center;color:var(--bq-muted);font-size:12px;white-space:nowrap}
#plain-walk-history .bq-dot{width:4px;height:4px;border-radius:50%;background:#97aaa0}
#plain-walk-history .bq-dot.on{width:12px;background:var(--bq-shell);border-radius:3px}
#plain-walk-history .bq-count{margin-left:4px;font-variant-numeric:tabular-nums}
#plain-walk-history .bq-stage{height:calc(var(--bq-tile-height) * 3 + 56px);position:relative;isolation:isolate;touch-action:none;user-select:none;overflow:hidden}
#plain-walk-history .bq-cluster-page{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50%}
#plain-walk-history .bq-bubble{position:absolute;width:var(--bq-face);height:var(--bq-tile-height);border:0;padding:0;background:transparent;color:var(--bq-ink);transform:translate(calc(-50% + var(--bq-push-x,0px)),calc(-50% + var(--bq-push-y,0px)));touch-action:none;z-index:1;display:block}
#plain-walk-history .bq-tile{display:block;width:100%;height:var(--bq-tile-height);background:var(--bq-paper);overflow:hidden;transform:translateY(calc((var(--zoom,1) - 1) * -14px)) scale(var(--zoom,1)) skew(-8deg);transition:transform 160ms var(--bq-ease),box-shadow 180ms ease-out;box-shadow:0 3px 8px #1f5c4d16;border:2px solid var(--bq-paper);transform-origin:50% 70%}
#plain-walk-history .bq-portrait{display:block;width:100%;height:var(--bq-photo);overflow:hidden;background:#dde9e3}
#plain-walk-history .bq-portrait img{width:120%;height:100%;display:block;object-fit:cover;transform:translateX(-8%) skew(8deg) scale(1.04);-webkit-user-drag:none}
#plain-walk-history .bq-name{display:block;font-size:13px;font-weight:700;line-height:22px;height:22px;white-space:nowrap;text-align:center;transform:skew(8deg);color:var(--bq-ink)}
#plain-walk-history .bq-focused{z-index:5}
#plain-walk-history .bq-focused .bq-tile{border-color:var(--bq-shell);box-shadow:0 8px 18px #1f5c4d30}
#plain-walk-history .bq-focused .bq-name{color:var(--bq-shell);font-weight:800}
#plain-walk-history .bq-rear{pointer-events:none}
#plain-walk-history .bq-rear .bq-name,#plain-walk-history .bq-rear-label{visibility:hidden}
#plain-walk-history .bq-rear .bq-tile{box-shadow:none}
#plain-walk-history .bq-neighbor-name{position:absolute;top:8px;color:var(--bq-muted);font-size:12px;line-height:20px;z-index:0;pointer-events:none}
#plain-walk-history .bq-nav{background:var(--bq-shell);color:#b5cfc4;display:flex;gap:8px;padding:8px 12px}
#plain-walk-history .bq-nav>span{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700}
#plain-walk-history .bq-nav .on{background:var(--bq-paper);color:var(--bq-shell);border-radius:3px}
#plain-walk-history .bq-note{font-size:12px;color:var(--bq-muted);line-height:1.6;padding:8px 0;margin:0}
#plain-walk-history .bq-bubble:focus-visible{outline:2px solid var(--bq-shell);outline-offset:3px}
#plain-walk-history ::selection{background:#b5cfc4;color:var(--bq-ink)}
@media(max-width:350px){#plain-walk-history{--bq-side:16px}#plain-walk-history .bq-group-title{font-size:24px}}
@media(prefers-reduced-motion:reduce){#plain-walk-history .bq-tile{transition:border-color 100ms linear,box-shadow 100ms linear}#plain-walk-history .bq-portrait{transition:opacity 100ms linear}}

#plain-walk-history .bq-tile{position:relative}#plain-walk-history .bq-cage-label{display:block;position:relative;height:16px;padding:0 5px;background:var(--bq-bg);color:var(--bq-muted);font-size:12px;font-weight:600;line-height:16px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}#plain-walk-history .bq-cage-label>span{display:inline-block;transform:skew(8deg)}#plain-walk-history .bq-rear .bq-cage-label{visibility:hidden}
#plain-walk-history .bq-walk{min-height:44px;border:1px solid var(--bq-shell);border-radius:3px;background:var(--bq-paper);color:var(--bq-shell);font-size:14px;font-weight:700;padding:8px 12px;white-space:nowrap}
#plain-walk-history .bq-walk:hover{filter:brightness(.94)}
#plain-walk-history .bq-walk:active{transform:translateY(1px)}
#plain-walk-history .bq-add-dog .bq-tile{display:flex;align-items:center;justify-content:center;background:var(--bq-paper);border-color:var(--bq-line);color:var(--bq-shell)}
#plain-walk-history .bq-add-dog i,#plain-walk-history .bq-add-dog svg{width:28px;height:28px;transform:skew(8deg);font-style:normal;font-size:28px;font-weight:400;line-height:28px;text-align:center}
#plain-walk-history .bq-add-dog:hover .bq-tile,#plain-walk-history .bq-add-dog:focus-visible .bq-tile{border-color:var(--bq-shell)}


#plain-walk-history .bq-action-area{padding:12px var(--bq-side);background:var(--bq-paper);border-top:1px solid var(--bq-line)}
#plain-walk-history .bq-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;max-width:340px;margin-inline:auto}
#plain-walk-history .bq-all{min-width:0;min-height:44px;font-size:15px;background:var(--bq-shell);color:var(--bq-paper);padding:10px 16px}
#plain-walk-history .bq-exceptions{min-height:44px;padding:10px 4px;white-space:nowrap;font-size:13px;color:var(--bq-shell);background:transparent;border:0;text-decoration:underline;text-underline-offset:4px}
#plain-walk-history .bq-feedback{font-size:13px;line-height:20px;color:var(--bq-muted);margin:0 0 8px;text-align:center;text-wrap:balance}
#plain-walk-history .bq-excluded .bq-portrait{opacity:.38}
#plain-walk-history .bq-excluded .bq-name{color:var(--bq-muted);text-decoration:line-through}

#plain-walk-history .bq-all:disabled{opacity:.45;transform:none}
#plain-walk-history .bq-add-dog:disabled{opacity:.5}
#plain-walk-history .bq-rear .bq-add-dog{visibility:hidden}
#plain-walk-history .bq-rear{filter:saturate(.72)}
#plain-walk-history .bq-moving .bq-cluster-page{will-change:transform,opacity}
#plain-walk-history .bq-portrait{transition:opacity 140ms ease-out}
#plain-walk-history .bq-exceptions:hover{text-decoration-thickness:2px}
#plain-walk-history .bq-history-summary{font-size:13px;line-height:20px;color:var(--bq-muted);margin:0;padding:0 var(--bq-side) 4px;min-height:24px;text-wrap:pretty}</style>

<script>
(()=>{
const root=document.getElementById('plain-walk-history');
const groups=JSON.parse(root.querySelector('#plain-walk-data').textContent).groups;
const stage=root.querySelector('.bq-stage');
const positions=[[.31,.22],[.51,.22],[.71,.22],[.21,.52],[.41,.52],[.61,.52],[.81,.52],[.21,.82],[.41,.82],[.61,.82],[.81,.82]];
let groupIndex=0,focusIndex=0,start=null,dragX=0,layers=[],items=[],dragging=false,exceptMode=false;let depthFrame=0,depthProgress=0,motionTimer=0;const exclusions=groups.map(()=>new Set());
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function age(d){return d.walkedDate==='2026-10-17'?'上次溜 今天':d.walkedDate==='2026-10-16'?'上次溜 1 天前':'上次溜 2 天前'}
function focus(i,zoom=1.12){focusIndex=i;const active=items[i];if(!active)return;const ax=+active.dataset.x,ay=+active.dataset.y;items.forEach((el,j)=>{const vx=+el.dataset.x-ax,vy=+el.dataset.y-ay,distance=Math.hypot(vx,vy),push=!reduced.matches&&j!==i&&distance<.30?.008:0;el.style.setProperty('--bq-push-x',(distance?vx/distance*push*stage.clientWidth:0)+'px');el.style.setProperty('--bq-push-y',(distance?vy/distance*push*stage.clientHeight:0)+'px');el.classList.toggle('bq-focused',j===i);el.style.setProperty('--zoom',j===i&&!reduced.matches&&!exceptMode?zoom:1)})}
function updateText(){let neighbor=stage.querySelector('.bq-neighbor-name');if(!neighbor){neighbor=document.createElement('span');neighbor.className='bq-neighbor-name';stage.append(neighbor)}neighbor.textContent=groups[groupIndex===0?1:0].label;neighbor.style.left=groupIndex===0?'auto':'16px';neighbor.style.right=groupIndex===0?'16px':'auto';const g=groups[groupIndex];const title=root.querySelector('.bq-group-title');title.textContent=g.label;const small=document.createElement('small');small.textContent=g.dogs.length+' 隻';title.append(small);const dates=new Map();g.dogs.forEach(d=>{const label=d.walkedDate==='2026-10-17'?'今天':d.walkedDate==='2026-10-16'?'昨天':'前天';if(!dates.has(label))dates.set(label,[]);dates.get(label).push(d.name)});root.querySelector('.bq-history-summary').textContent=dates.size===1?g.dogs.length+' 隻'+[...dates.keys()][0]+'都溜過':[...dates].map(([label,names])=>names.join('、')+label+'溜過').join('；');root.querySelector('.bq-count').textContent=(groupIndex+1)+' / '+groups.length;root.querySelectorAll('.bq-dot').forEach((e,i)=>e.classList.toggle('on',i===groupIndex));renderActions();}
function depth(progress=0,animate=false){if(reduced.matches)progress=0;clearTimeout(motionTimer);stage.classList.toggle('bq-moving',!reduced.matches&&(animate||progress!==0));if(animate)motionTimer=setTimeout(()=>stage.classList.remove('bq-moving'),380);layers.forEach((layer,i)=>{const d=i-groupIndex-progress,distance=Math.min(1,Math.abs(d)),rearScale=groups[i].dogs.length>2?.34:.50,scale=1-(1-rearScale)*distance,x=Math.sign(d)*Math.min(1,Math.abs(d))*stage.clientWidth*.35,y=-(groups[i].dogs.length>2?72:92)*distance;layer.style.transition=animate&&!reduced.matches?'transform 360ms cubic-bezier(.16,1,.3,1),opacity 260ms ease-out':'none';layer.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';layer.style.opacity=1-distance*.52;layer.style.zIndex=distance<.5?'3':'1';const active=i===groupIndex;layer.classList.toggle('bq-rear',!active);layer.setAttribute('aria-hidden',String(!active));layer.inert=!active})}
function queueDepth(progress){depthProgress=progress;if(!depthFrame)depthFrame=requestAnimationFrame(()=>{depthFrame=0;depth(depthProgress)})}
function stopDepth(){if(depthFrame){cancelAnimationFrame(depthFrame);depthFrame=0}}

function activate(animate){layers.forEach(layer=>layer.querySelectorAll('.bq-bubble').forEach(el=>{el.style.setProperty('--zoom',1);el.style.setProperty('--bq-push-x','0px');el.style.setProperty('--bq-push-y','0px');el.classList.remove('bq-focused')}));items=[...layers[groupIndex].querySelectorAll('.bq-bubble:not(.bq-add-dog)')];exceptMode=false;exclusions[groupIndex].clear();updateText();focus(0,1);depth(0,animate);}
function build(){stage.replaceChildren();layers=groups.map((g,gi)=>{const page=document.createElement('div');page.className='bq-cluster-page';page.dataset.group=g.label;const label=document.createElement('div');label.className='bq-rear-label';label.textContent=g.label;page.append(label);g.dogs.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='bq-bubble cursor-interaction';b.setAttribute('aria-label',d.name+'，'+d.cage+'，'+age(d));const pos=g.dogs.length===2?[[.31,.52],[.51,.52]][i]:positions[i];b.dataset.dog=i;b.dataset.x=pos[0];b.dataset.y=pos[1];b.style.left=pos[0]*100+'%';b.style.top=pos[1]*100+'%';const circle=document.createElement('span');circle.className='bq-portrait';const img=document.createElement('img');img.draggable=false;img.src=d.photo;img.alt=d.name;const name=document.createElement('span');name.className='bq-name';name.textContent=d.name;circle.append(img);const tile=document.createElement('span');tile.className='bq-tile';const cage=document.createElement('span');cage.className='bq-cage-label';const cageText=document.createElement('span');cageText.textContent=d.cage;cage.append(cageText);b.dataset.tooltip=age(d)+' · '+d.walkedDate;tile.append(cage,circle,name);b.append(tile);b.addEventListener('focus',()=>{if(gi===groupIndex)focus(i)});b.addEventListener('click',event=>{if(!dragging&&gi===groupIndex){if(exceptMode&&event.detail===0)toggleExclude(i);else if(!exceptMode)focus(i)}});page.append(b);});const add=document.createElement('button');add.type='button';add.className='bq-bubble bq-add-dog cursor-interaction';add.setAttribute('aria-label','加入狗到'+g.label+'（功能示意）');const ap=g.dogs.length===2?[.71,.52]:positions[10];add.style.left=ap[0]*100+'%';add.style.top=ap[1]*100+'%';const blank=document.createElement('span');blank.className='bq-tile';const icon=document.createElement('i');icon.dataset.lucide='plus';icon.textContent='+';icon.setAttribute('aria-hidden','true');blank.append(icon);add.append(blank);add.addEventListener('click',()=>{if(!dragging&&gi===groupIndex)showAdd()});page.append(add);stage.append(page);return page;});activate(false);}
function feedback(text){const el=root.querySelector('.bq-feedback');el.textContent=text;el.hidden=!text}
function showAdd(){feedback('加入狗（功能示意）')}
function renderActions(){const g=groups[groupIndex],omitted=exclusions[groupIndex],n=g.dogs.length-omitted.size;const all=root.querySelector('.bq-all'),secondary=root.querySelector('.bq-exceptions');all.textContent=exceptMode?'登記其餘 '+n+' 隻':'整群溜了 · '+g.dogs.length+' 隻';all.disabled=exceptMode&&n===0;secondary.textContent=exceptMode?'取消':'有狗沒溜';secondary.setAttribute('aria-pressed',String(exceptMode));stage.querySelectorAll('.bq-add-dog').forEach(e=>e.disabled=exceptMode);items.forEach((el,i)=>{el.classList.toggle('bq-excluded',exceptMode&&omitted.has(i));if(exceptMode)el.setAttribute('aria-pressed',String(omitted.has(i)));else el.removeAttribute('aria-pressed');const d=g.dogs[i];if(exceptMode)delete el.dataset.tooltip;else el.dataset.tooltip=age(d)+' · '+d.walkedDate;el.setAttribute('aria-label',exceptMode?d.name+'，'+(omitted.has(i)?'這次沒溜，再點可恢復':'這次有溜，點選排除'):d.name+'，'+d.cage+'，'+age(d));});feedback(exceptMode?(n===0?'尚未選擇這次有溜的狗':'點選這次沒溜的狗 · 已排除 '+omitted.size+' 隻'):'')}
function toggleExclude(i){const omitted=exclusions[groupIndex];omitted.has(i)?omitted.delete(i):omitted.add(i);focus(i,1);renderActions()}

function change(step){const next=groupIndex+step;if(next<0||next>=groups.length){depth(0,true);return}groupIndex=next;activate(true);}
function near(e){const r=stage.getBoundingClientRect();let closest=0,min=Infinity;items.forEach((el,i)=>{const distance=Math.hypot(e.clientX-r.left-(+el.dataset.x)*r.width,e.clientY-r.top-(+el.dataset.y)*r.height);if(distance<min){min=distance;closest=i;}});if(min<95)focus(closest);}
stage.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button:disabled'))return;e.preventDefault();stopDepth();const layer=layers[groupIndex];const matrix=new DOMMatrixReadOnly(getComputedStyle(layer).transform);const seed=reduced.matches?0:-matrix.m41/(stage.clientWidth*.35);layers.forEach(el=>{const transform=getComputedStyle(el).transform;el.style.transition='none';el.style.transform=transform});start={x:e.clientX,y:e.clientY,t:performance.now(),seed,adding:!!e.target.closest('.bq-add-dog'),dog:e.target.closest('[data-dog]')?.dataset.dog};dragX=0;dragging=false;stage.setPointerCapture(e.pointerId);if(!start.adding&&!exceptMode)near(e)});
stage.addEventListener('pointermove',e=>{if(!start){if(!exceptMode&&e.pointerType==='mouse'&&!e.target.closest('.bq-add-dog'))near(e);return}dragX=e.clientX-start.x;const dy=e.clientY-start.y;if(!dragging&&Math.abs(dragX)>12&&Math.abs(dragX)>Math.abs(dy)*1.1){dragging=true;items.forEach(el=>{el.style.setProperty('--zoom',1);el.style.setProperty('--bq-push-x','0px');el.style.setProperty('--bq-push-y','0px')})}if(dragging){let progress=start.seed-dragX/(stage.clientWidth*.65);if(groupIndex+progress<0||groupIndex+progress>groups.length-1)progress*=.18;queueDepth(Math.max(-1,Math.min(1,progress)))}else if(!start.adding&&!exceptMode)near(e)});
function end(e){if(!start)return;stopDepth();const current=start,dx=e.clientX-current.x,dy=e.clientY-current.y,elapsed=Math.max(16,performance.now()-current.t);start=null;const horizontal=dragging&&Math.abs(dx)>Math.abs(dy)*1.1;const progress=current.seed-dx/(stage.clientWidth*.65),flick=Math.abs(dx)>28?-dx/elapsed*120/(stage.clientWidth*.65):0;const projected=progress+flick;if(horizontal&&Math.abs(projected)>.34)change(projected>0?1:-1);else{depth(0,true);if(!dragging&&Math.hypot(dx,dy)<12){if(current.adding&&!exceptMode)showAdd();else if(exceptMode&&current.dog!==undefined)toggleExclude(Number(current.dog))}}setTimeout(()=>dragging=false,0)}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',()=>{stopDepth();start=null;dragging=false;depth(0,true)});
stage.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();change(1);items[0].focus({preventScroll:true})}if(e.key==='ArrowLeft'){e.preventDefault();change(-1);items[0].focus({preventScroll:true})}});
root.querySelector('.bq-exceptions').onclick=()=>{exceptMode=!exceptMode;exclusions[groupIndex].clear();renderActions()};root.querySelector('.bq-all').onclick=()=>{const omitted=exclusions[groupIndex],count=groups[groupIndex].dogs.length-(exceptMode?omitted.size:0);if(!count)return;const names=exceptMode?[...omitted].map(i=>groups[groupIndex].dogs[i].name):[];feedback('示意：登記 '+count+' 隻'+(names.length?'，排除 '+names.join('、'):'')+'，尚未儲存')};reduced.addEventListener('change',()=>{stopDepth();start=null;dragging=false;focus(focusIndex,1);depth()});new ResizeObserver(()=>{stopDepth();depth()}).observe(stage);build();if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:20,height:20}});
})();
