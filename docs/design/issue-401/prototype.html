<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溜狗表狀態比較</title>
<!-- #401 Prototype：天數色彩強度 × 今天有人溜／自己已登記。只用記憶體假資料，不寫試算表／D1。 -->
<style>
:root {
  --surface: #FFFFFF; --surface-soft: #EEF2EF; --page: #E4EAE6;
  --ink: #16211D; --ink-soft: #4E5E57; --line: #C4CFC9;
  --primary: #1F5C4D; --primary-soft: #DDE9E3;
  --red-text: #B3121F; --red-bg: #FBE3E4; --tab-red: #C8202B;
  --amber-text: #8A4B00; --amber-bg: #FCEFD6; --tab-amber: #F2B21B;
  --green-text: #1E6B3C; --green-bg: #DFF0E4;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #E4EAE6; } }
:root[data-theme="dark"] { --page: #E4EAE6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.4 system-ui, "Noto Sans TC", sans-serif; }
body.big { font-size: 20px; }
.wrap { max-width: 430px; margin: 0 auto; padding: 0 16px 40px; }
.panel { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 12px 0 8px; }
.panel h1 { font-size: 17px; margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; align-items: center; }
.row > span { font-size: 13px; color: var(--ink-soft); width: 40px; }
.seg button { font: inherit; font-size: 14px; padding: 6px 10px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; color: var(--ink); }
.seg button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); font-weight: 700; }
.hint { font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 4px; padding: 8px 8px 8px 0; min-height: 72px; position: relative; overflow: hidden; }
.photo { width: 52px; height: 52px; border-radius: 4px; background: var(--surface-soft); flex-shrink: 0; display: grid; place-items: center; font-size: 22px; }
.info { flex: 1; min-width: 0; }
.name { font-size: 1.1em; font-weight: 800; }
.sub { font-size: .8em; color: var(--ink-soft); }
.who { font-size: .8em; margin-top: 2px; }
.days { flex-shrink: 0; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.days b { font-size: 1.7em; line-height: 1; font-weight: 900; }
.days small { font-size: .8em; font-weight: 700; }
.days .today { font-size: 1.1em; font-weight: 700; }

/* A 現行：整塊實心色底 */
.sA .days { align-self: stretch; margin: -8px 0; display: flex; align-items: center; justify-content: center; color: #fff; }
.sA .days.red { background: var(--tab-red); }
.sA .days.amber { background: var(--tab-amber); color: var(--ink); }
.sA .days.green { background: var(--green-bg); color: var(--green-text); }
/* B 只有數字上色，白底 */
.sB .days { padding-left: 8px; }
.sB .days.red { color: var(--red-text); }
.sB .days.amber { color: var(--amber-text); }
.sB .days.green { color: var(--ink-soft); }
/* C 左緣細色條＋黑字 */
.sC .card { padding-left: 6px; }
.sC .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
.sC .card.red::before { background: var(--tab-red); }
.sC .card.amber::before { background: var(--tab-amber); }
.sC .days.green { color: var(--ink-soft); }
/* D 一律黑字，只有超過門檻多一個小標籤 */
.sD .days { padding-left: 8px; }
.sD .days.green { color: var(--ink-soft); }
.flag { display: none; }
.sD .flag { display: inline-block; margin-top: 3px; font-size: .65em; font-weight: 800; padding: 0 5px; border-radius: 3px; }
.sD .days.red .flag { background: var(--red-bg); color: var(--red-text); }
.sD .days.amber .flag { background: var(--amber-bg); color: var(--amber-text); }

/* 登記按鈕 */
.btn { font: inherit; font-size: .95em; font-weight: 800; min-width: 76px; min-height: 48px; padding: 0 10px; border-radius: 6px; border: 2px solid var(--primary); background: var(--surface); color: var(--primary); flex-shrink: 0; }
.btn.mine { background: var(--primary); color: #fff; }
.btn.join { border-style: dashed; }
.btn.pending { border-color: var(--line); color: var(--ink-soft); }
.btn.fail { border-color: var(--red-text); color: var(--red-text); }
.btn.locked { background: var(--surface-soft); border-color: var(--line); color: var(--ink-soft); }
.others { display: inline-block; font-size: .78em; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: var(--surface-soft); color: var(--ink); }
.mine-tag { display: inline-block; font-size: .78em; font-weight: 800; padding: 1px 6px; border-radius: 3px; background: var(--primary-soft); color: var(--primary); }
.err { color: var(--red-text); font-weight: 700; }
.note { margin-top: 20px; font-size: 13px; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>#401 狀態比較（假資料）</h1>
    <div class="row seg" id="style"><span>天數</span>
      <button data-v="A" aria-pressed="false">A 現行色塊</button>
      <button data-v="B" aria-pressed="true">B 只有數字上色</button>
      <button data-v="C" aria-pressed="false">C 左緣細條</button>
      <button data-v="D" aria-pressed="false">D 黑字＋小標</button>
    </div>
    <div class="row seg" id="size"><span>字級</span>
      <button data-v="n" aria-pressed="true">一般</button>
      <button data-v="big" aria-pressed="false">大字</button>
    </div>
    <p class="hint">點按鈕可以實際切換狀態：溜了 → 登記中 → 已溜（約 1 秒）；「失敗」那隻會寫入失敗。</p>
  </div>
  <div class="list" id="list"></div>
  <p class="note">門檻沿用正式設定：3 天起黃、5 天起紅。這頁不連線、不寫資料，重新整理就回到初始狀態。</p>
</div>
<script>
const AMBER = 3, RED = 5;
// state：none 今天沒人溜｜others 別人溜過、自己沒登記｜mine 自己已登記｜locked 自己已登記但不能復原（名單被別人改過）
const dogs = [
  { name: '小黑', cage: 'A5', days: 100, state: 'none', emoji: '🐕' },
  { name: '阿花', cage: 'B2', days: 14, state: 'none', emoji: '🐶' },
  { name: '豆豆', cage: 'A7', days: 6, state: 'none', emoji: '🐕' },
  { name: '失敗', cage: 'C1', days: 4, state: 'none', emoji: '🐶', willFail: true },
  { name: '旺財', cage: 'B4', days: 3, state: 'none', emoji: '🐕' },
  { name: '咪咪', cage: 'C3', days: 1, state: 'none', emoji: '🐶' },
  { name: '來福', cage: 'A2', days: 0, state: 'others', walkers: ['小美'], emoji: '🐕' },
  { name: '球球', cage: 'B1', days: 0, state: 'mine', walkers: ['我', '小美'], emoji: '🐶' },
  { name: '胖胖', cage: 'C2', days: 0, state: 'locked', walkers: ['我', '阿明'], emoji: '🐕' },
];
const level = d => d >= RED ? 'red' : d >= AMBER ? 'amber' : 'green';
const flagText = d => d >= RED ? '很久沒溜' : d >= AMBER ? '該溜了' : '';

function daysHtml(dog) {
  const lv = level(dog.days);
  const val = dog.days === 0 ? '<span class="today">今天</span>' : `<b>${dog.days}</b><small>天</small>`;
  const flag = flagText(dog.days) ? `<br><span class="flag">${flagText(dog.days)}</span>` : '';
  return `<div class="days ${lv}">${val}${flag}</div>`;
}
function whoHtml(dog) {
  if (dog.error) return `<div class="who err">沒寫進去，再按一次</div>`;
  const w = dog.walkers || [];
  if (dog.state === 'others') return `<div class="who"><span class="others">${w.join('、')} 今天溜過</span></div>`;
  if (dog.state === 'mine' || dog.state === 'locked') {
    const rest = w.filter(n => n !== '我');
    return `<div class="who"><span class="mine-tag">✓ 你已登記</span>${rest.length ? ` 同行：${rest.join('、')}` : ''}</div>`;
  }
  return '';
}
function btnHtml(dog, i) {
  if (dog.pending) return `<button class="btn pending" disabled>登記中</button>`;
  if (dog.error) return `<button class="btn fail" data-i="${i}">重試</button>`;
  if (dog.state === 'mine') return `<button class="btn mine" data-i="${i}">✓ 已溜</button>`;
  if (dog.state === 'locked') return `<button class="btn locked" disabled title="名單被別人改過，不能從這裡取消">✓ 已溜</button>`;
  if (dog.state === 'others') return `<button class="btn join" data-i="${i}">我也溜了</button>`;
  return `<button class="btn" data-i="${i}">溜了</button>`;
}
function render() {
  document.getElementById('list').innerHTML = dogs.map((d, i) =>
    `<div class="card ${level(d.days)}">${daysHtml(d)}<div class="photo">${d.emoji}</div>
      <div class="info"><div class="name">${d.name}</div><div class="sub">${d.cage}</div>${whoHtml(d)}</div>${btnHtml(d, i)}</div>`).join('');
}
document.getElementById('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const dog = dogs[+b.dataset.i];
  if (dog.state === 'mine') { // 復原：拿掉自己，名單還有別人就回到「別人溜過」
    dog.walkers = (dog.walkers || []).filter(n => n !== '我');
    dog.state = dog.walkers.length ? 'others' : 'none';
    if (!dog.walkers.length) dog.days = dog.prevDays ?? dog.days;
    return render();
  }
  dog.pending = true; dog.error = false; render();
  setTimeout(() => {
    dog.pending = false;
    if (dog.willFail && !dog.retried) { dog.error = true; dog.retried = true; return render(); }
    dog.prevDays = dog.days; dog.days = 0;
    dog.walkers = ['我', ...(dog.walkers || [])];
    dog.state = 'mine'; render();
  }, 1000);
});
function seg(id, fn) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    fn(b.dataset.v);
  });
}
seg('style', v => { document.getElementById('list').className = 'list s' + v; });
seg('size', v => document.body.classList.toggle('big', v === 'big'));
document.getElementById('list').className = 'list sB';
render();
</script>
</body>
</html>
