<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>板收圖鑑</title>
<meta name="description" content="板橋收容所的狗，一隻一張球員卡。你溜過的狗才拿得到卡，新拿到的包成卡包自己撕。">
<meta name="theme-color" content="#0B2A5B">
<link rel="icon" href="icons/icon-v2.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cards.css">
</head>
<body>
<!-- 板收圖鑑（K 2026-10-10）：電腦版溜狗表頁首「圖鑑」進來；你溜過的狗才拿得到卡（js/cards.js） -->
<main>
  <div class="bq-top">
    <header class="bq-mast">
      <div class="bq-lockup">
        <span class="bq-patch" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="5.5" cy="10" rx="2.3" ry="2.9" transform="rotate(-18 5.5 10)"/><ellipse cx="9.3" cy="5.6" rx="2.3" ry="3" transform="rotate(-6 9.3 5.6)"/><ellipse cx="14.7" cy="5.6" rx="2.3" ry="3" transform="rotate(6 14.7 5.6)"/><ellipse cx="18.5" cy="10" rx="2.3" ry="2.9" transform="rotate(18 18.5 10)"/><path d="M12 11c-2.7 0-6 3.6-6 6.6 0 1.8 1.3 2.9 3 2.9 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.7 0 3-1.1 3-2.9 0-3-3.3-6.6-6-6.6z"/></g></svg><span>板橋<br>收容所</span></span>
        <h1 id="bqTitle"><span class="sr-only">板收圖鑑 </span>BQ ALL-STARS <span class="bq-year">2026</span></h1>
      </div>
      <div class="bq-mast-r">
        <a class="bq-app-link" href="index.html"><svg class="bq-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>溜狗表</a>
        <a class="bq-progress" href="#bqBinderTitle" aria-label="圖鑑：已拿到 0 張">
          <span class="bq-progress-k">已拿到</span>
          <span class="bq-progress-n"><b data-bq="got">0</b>/<span data-bq="total">—</span></span>
          <span class="bq-progress-bar"><i id="bqBar"></i></span>
        </a>
      </div>
    </header>
  </div>

  <!-- 年度獎項先藏起來（K 2026-10-10：先有圖鑑就好），功能留著，拿掉 hidden 就會出現 -->
  <section class="bq-awards" aria-labelledby="bqAwardsTitle" hidden>
    <header class="bq-sec-head">
      <div>
        <h2 id="bqAwardsTitle">年度獎項</h2>
        <p>照收容所的資料頒的，不是投票</p>
      </div>
    </header>
    <div class="bq-trophies" id="bqAwards"></div>
  </section>

  <section class="bq-binder-sec" aria-labelledby="bqBinderTitle">
    <header class="bq-sec-head bq-binder-head">
      <div>
        <h2 id="bqBinderTitle">圖鑑</h2>
        <p>已拿到 <b data-bq="got">0</b> / <span data-bq="total">—</span> 張・所內每隻狗都在這裡，溜過才拿得到牠的卡</p>
      </div>
      <div class="bq-cta" id="bqCta" aria-live="polite"><p class="bq-cta-note">讀取中…</p></div>
    </header>
    <div class="bq-legend-row">
      <ul class="bq-legend" aria-label="圖例">
        <li><i class="lg-got"></i>拿到了</li>
        <li><i class="lg-pending"></i>溜過，還沒撕開</li>
        <li><i class="lg-locked"></i>還沒溜過</li>
      </ul>
    </div>
    <div class="bq-binder" id="bqBinder"></div>
    <!-- #271 已出所狗卡：每個人都直接收藏，不用開卡，不算進上面的進度 -->
    <section class="bq-alumni-sec" aria-labelledby="bqAlumniTitle">
      <header class="bq-sec-head bq-binder-head">
        <div>
          <h2 id="bqAlumniTitle">已出所</h2>
          <p><b data-bq="alumni">—</b> 隻已經離開收容所・謝謝大家陪過牠們，每個人都直接收藏</p>
        </div>
      </header>
      <div class="bq-binder" id="bqAlumni"></div>
    </section>
    <footer class="bq-foot">
      <p id="bqUpdated"></p>
      <a href="index.html"><svg class="bq-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>溜狗表</a>
    </footer>
  </section>
</main>

<div class="bq-field" id="bqField" role="dialog" aria-modal="true" aria-label="開卡包" hidden>
  <button type="button" class="bq-close bq-field-close" id="bqFieldClose" aria-label="關閉，回圖鑑"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  <div class="bq-table">
    <button type="button" class="bq-pack" id="bqPack" aria-label="撕開卡包">
      <span class="bq-pack-tear" aria-hidden="true"></span>
      <span class="bq-pack-crest" aria-hidden="true"><svg viewBox="0 0 24 24"><g fill="currentColor"><ellipse cx="5.5" cy="10" rx="2.3" ry="2.9" transform="rotate(-18 5.5 10)"/><ellipse cx="9.3" cy="5.6" rx="2.3" ry="3" transform="rotate(-6 9.3 5.6)"/><ellipse cx="14.7" cy="5.6" rx="2.3" ry="3" transform="rotate(6 14.7 5.6)"/><ellipse cx="18.5" cy="10" rx="2.3" ry="2.9" transform="rotate(18 18.5 10)"/><path d="M12 11c-2.7 0-6 3.6-6 6.6 0 1.8 1.3 2.9 3 2.9 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.7 0 3-1.1 3-2.9 0-3-3.3-6.6-6-6.6z"/></g></svg></span>
      <span class="bq-pack-t"><b>板收圖鑑</b><span>你溜過的狗</span><em>撕開</em></span>
    </button>
    <span class="bq-pack-strip" aria-hidden="true"></span>
    <span class="bq-pack-count" id="bqPackCount"></span>
    <div class="bq-hand" id="bqHand" aria-live="polite"></div>
  </div>
  <div class="bq-under">
    <p class="bq-pack-note" id="bqPackNote">點卡包撕開</p>
    <p class="bq-deal-note" id="bqDealNote"></p>
    <button type="button" class="bq-again" id="bqAgain" hidden>再開一包</button>
    <button type="button" class="bq-skip" id="bqSkip" hidden>跳過動畫</button>
    <button type="button" class="bq-all" id="bqAll" hidden>一次全開</button>
    <button type="button" class="bq-done" id="bqDone" hidden>收進圖鑑</button>
    <p class="bq-flip-hint">點卡片翻到背面</p>
  </div>
</div>

<div class="bq-modal" id="bqModal" hidden>
  <div class="bq-modal-in" role="dialog" aria-modal="true" aria-label="球員卡">
    <button type="button" class="bq-close" id="bqClose" aria-label="關閉"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <div id="bqModalCard"></div>
    <p class="bq-modal-hint">點卡片翻面・Esc 關閉</p>
  </div>
</div>

<script type="module" src="js/cards-entry.js"></script>
</body>
</html>
