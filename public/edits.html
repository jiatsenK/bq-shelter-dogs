<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>編輯紀錄｜板收志工溜狗表</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="icon" href="icons/icon-v2.svg" type="image/svg+xml">
<style>
  :root { --ink: #1c2430; --muted: #5f6b7a; --line: #dde3ea; --bg: #f6f8fa; --card: #fff; --accent: #0B2A5B; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  header { background: var(--accent); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
  header a { color: #fff; text-decoration: none; font-weight: 700; }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .hint { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .who { font-weight: 700; }
  .when { color: var(--muted); font-size: 14px; }
  .what { font-weight: 700; color: var(--accent); }
  .diff { margin-top: 6px; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 14px; }
  .diff dt { color: var(--muted); }
  .diff dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .status { color: var(--muted); }
  html.embedded header, html.embedded .hint { display: none; }
  html.embedded { --bg: #E3E9E5; --ink: #16211D; --muted: #4E5E57; --line: #C4CFC9; --accent: #1F5C4D; }
  html.embedded main { padding: 0 16px 16px; }
</style>
<script>if (self !== top && new URLSearchParams(location.search).get('embedded') === '1') document.documentElement.classList.add('embedded');</script>
</head>
<body>
<!-- 編輯紀錄（ADR 0004）：誰做了什麼編輯；資料來自 GET api/edits（js/edits.js） -->
<header>
  <a href="index.html">← 溜狗表</a>
  <h1>編輯紀錄</h1>
</header>
<main>
  <p class="hint">大家都能直接改休養、介紹、照片等，每次修改都記在這裡。改錯了可以照「改前」改回來；換掉的照片 30 天內還能找回來。</p>
  <div class="status" id="status">讀取中…</div>
  <ol id="list"></ol>
</main>
<script src="js/dates.js"></script>
<script src="js/api.js"></script>
<script src="js/edits.js"></script>
</body>
</html>
