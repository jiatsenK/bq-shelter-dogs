# 照片放 R2 以後的縮圖（#130）
# - 只供人工補圖：網站換照片時自己產生縮圖（#566），Worker 不再叫這個 Action；沒縮圖的照片網站顯示原圖＋小圖示，要補就手動跑
# - 問網站哪些照片還沒縮圖、下載原圖、做好縮圖傳回網站存進 R2（scripts/make-thumbs.py --site），不提交 repo
# - 縮圖還沒好之前網站會先顯示原圖，所以不影響使用
# - 在 Actions 頁選「產生照片縮圖（R2）」→「Run workflow」手動跑
name: 產生照片縮圖（R2）

on:
  workflow_dispatch:

permissions:
  contents: read

# 連傳好幾張時排隊跑，後面那次會看到全部照片
concurrency:
  group: r2-thumbs
  cancel-in-progress: false

jobs:
  thumbs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # #493：帳號子網域放 GitHub Secret，日誌裡顯示成 ***
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      SITE_URL: https://bq-shelter-dogs.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev
      ADMIN_KEY: ${{ secrets.ADMIN_KEY || secrets.NOTES_PASSCODE }}
    steps:
      - name: 沒設 WORKERS_SUBDOMAIN 就停
        if: env.WORKERS_SUBDOMAIN == ''
        run: |
          echo "還沒在 GitHub 設 WORKERS_SUBDOMAIN（帳號的 workers.dev 子網域，步驟見 docs/setup/CLOUDFLARE_SETUP.md）。"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 跟「產生照片縮圖」用同一個 Pillow 版本，縮圖品質一樣
      - name: 安裝 Pillow
        run: pip install pillow==12.3.0

      - name: 產生縮圖
        run: python scripts/make-thumbs.py --site "$SITE_URL"
