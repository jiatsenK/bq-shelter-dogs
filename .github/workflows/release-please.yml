# 版本號（release-please）：main 有新 commit 就更新一張「Release PR」，裡面改好 version.txt 和 CHANGELOG.md。
# - 版本號照 commit 開頭決定：fix: → 9.0.1，feat: → 9.1.0，feat!: 或 BREAKING CHANGE → 10.0.0；docs:／chore: 不升版。
# - Release PR 合併後才打 tag（v9.1.0）並建立 GitHub Release，內容就是這次的改動清單。
# - 第一次用要到 repo Settings → Actions → General 勾「Allow GitHub Actions to create and approve pull requests」。
name: 版本號

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
