# 每個 PR 自動產生預覽網址（#126）：K 合併前就能用手機打開看實際畫面
# - 網址固定是 https://pr-<PR 編號>-bq-shelter-dogs.<帳號>.workers.dev，同一個 PR 再推送會更新同一個網址
# - 只上傳一個「版本」，不影響正式網站（正式網站只有 deploy-cloudflare.yml 會換）
# - 預覽版帶 PREVIEW 變數：可以看、可以讀，上傳照片、存備註、按「更新」都會被 Worker 擋下，正式資料不受影響
# - 部署完在 PR 留一則留言貼網址，再推送時更新同一則，不會一直新增
# - 還沒設 Cloudflare Secret、或是從別人 fork 開的 PR（拿不到 Secret）就跳過
name: PR 預覽網址

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-cloudflare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 還沒設定 Cloudflare 就跳過
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "還沒在 GitHub 設 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，這次不產生預覽（步驟見 docs/CLOUDFLARE_SETUP.md）。"

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22

      - name: 上傳預覽版本
        id: upload
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes wrangler@4 versions upload \
            --preview-alias "pr-${PR}" \
            --var PREVIEW:1 \
            --tag "pr-${PR}" \
            --message "PR #${PR} ${SHA:0:7}" | tee "$RUNNER_TEMP/upload.log"
          url=$(grep -oE "https://pr-${PR}-[a-z0-9.-]+\.workers\.dev" "$RUNNER_TEMP/upload.log" | head -1)
          if [ -z "$url" ]; then echo "找不到預覽網址"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: 在 PR 貼預覽網址（再推送時更新同一則留言）
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\n📱 **預覽網址**：${process.env.URL}\n\n` +
              `對應這個 PR 最新的提交（${process.env.SHA.slice(0, 7)}）。預覽版可以看、可以讀，但上傳照片、存備註、按「更新」都不會存，正式資料不受影響。`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
