# #460 唯讀查詢：PR 加上 cpu-history 標籤時，讀正式 Worker 過去 7 天的 CPU 紀錄，結果留言在 PR。
# 只呼叫 Cloudflare 分析 API，不部署、不改設定、不寫任何資料。
name: CPU 紀錄查詢

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  history:
    if: github.event.label.name == 'cpu-history' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 查詢
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cpu-history.mjs 7 | tee "$RUNNER_TEMP/history.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync(`${process.env.RUNNER_TEMP}/history.md`, 'utf8');
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `**CPU 紀錄查詢（唯讀）**\n\n${body}` });
