# 預覽測試庫補資料：PR 預覽網址綁的是隔離測試 D1（bq-shelter-dogs-test，#214），原本是空的，預覽畫面會顯示「狗的資料讀不到」
# - 只能手動跑：Actions 頁選「準備預覽資料庫」→「Run workflow」。第一次跑建表＋匯入，之後想讓預覽資料跟上試算表再跑一次
# - 只寫測試庫，不碰正式 D1：建表指令明確帶 wrangler.preview-db.jsonc
# - #501 起不再從試算表匯入（試算表同步退出 Actions）：只建表、補欄位、補固定照顧，測試庫保留既有資料（預覽版 Worker 不收寫回，無法用 GAS 灌；要更新預覽資料另開票）
name: 準備預覽資料庫

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 整份 schema 都是 IF NOT EXISTS／OR IGNORE，重跑不影響已有資料；同步會略過的 identity 觸發器也在這裡一起建
      - name: 測試庫建表
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有設定 CLOUDFLARE_API_TOKEN，無法寫入 D1。"; exit 1; fi
          npx --yes wrangler@4 d1 execute bq-shelter-dogs-test --remote --config wrangler.preview-db.jsonc --file db/compact-schema.sql

      # 測試庫的表比後來加的欄位（例：v3_dogs.fixed_care）早建，CREATE TABLE IF NOT EXISTS 補不到，缺了預覽讀狗會 no such column
      - name: 測試庫補欄位
        run: node scripts/migrate-compact-db.mjs

      # 「有人固定照顧」是網站寫進正式庫的，試算表沒有；照正式庫的名單補到測試庫（正式庫只讀）
      - name: 測試庫補固定照顧
        run: node scripts/copy-fixed-care.mjs

      # 匯入後核對：主清單幾隻、幾隻沒有遛狗日期（預覽溜狗表「沒有紀錄」的狗排最前）、溜狗紀錄幾筆
      - name: 核對測試庫
        run: |
          npx --yes wrangler@4 d1 execute bq-shelter-dogs-test --remote --config wrangler.preview-db.jsonc --json --command \
            "SELECT (SELECT COUNT(*) FROM v3_sheet_main) AS main, (SELECT COUNT(*) FROM v3_sheet_main WHERE walked_date IS NULL OR walked_date='') AS no_date, (SELECT MIN(walked_date) FROM v3_sheet_main) AS min_date, (SELECT MAX(walked_date) FROM v3_sheet_main) AS max_date, (SELECT COUNT(*) FROM v3_walks) AS walks, (SELECT COUNT(*) FROM v3_dogs WHERE fixed_care=1) AS fixed_care, (SELECT COUNT(*) FROM v3_packs) AS packs, (SELECT small FROM v3_pack_versions) AS small"
