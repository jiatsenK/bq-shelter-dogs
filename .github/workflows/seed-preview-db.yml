# 預覽測試庫補資料：PR 預覽網址綁的是隔離測試 D1（bq-shelter-dogs-test，#214），原本是空的，預覽畫面會顯示「狗的資料讀不到」
# - 只能手動跑：Actions 頁選「準備預覽資料庫」→「Run workflow」。每次都把測試庫整份換成正式庫當下的資料
# - #520 起從正式 D1 匯出再匯入（#501 退役試算表同步後沒有別的灌法）：正式庫只跑 d1 export（只讀），清空與匯入都明確帶 wrangler.preview-db.jsonc
# - 測試庫原有資料（含預覽時寫的）會被覆蓋
name: 準備預覽資料庫

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Taipei
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 正式庫匯出、測試庫清空後匯入
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有設定 CLOUDFLARE_API_TOKEN，無法寫入 D1。"; exit 1; fi
          node scripts/copy-prod-d1.mjs

      # 兩邊各數一次，狗清單要一致（正式庫只送 SELECT）；溜狗紀錄匯出後仍可能有新的，不比
      - name: 核對測試庫跟正式庫
        run: |
          q="SELECT (SELECT COUNT(*) FROM v3_dogs) AS dogs, (SELECT COUNT(*) FROM v3_sheet_main) AS main, (SELECT group_concat(number) FROM (SELECT number FROM v3_sheet_main ORDER BY number)) AS numbers"
          prod=$(npx --yes wrangler@4 d1 execute bq-shelter-dogs --remote --json --command "$q" | jq -c '.[0].results[0]')
          test=$(npx --yes wrangler@4 d1 execute bq-shelter-dogs-test --remote --config wrangler.preview-db.jsonc --json --command "$q" | jq -c '.[0].results[0]')
          echo "正式庫 $prod"; echo "測試庫 $test"
          [ "$prod" = "$test" ] || { echo "測試庫跟正式庫筆數不一致"; exit 1; }
