# 定期把 Google 試算表同步成 data/dogs.json（#31）
# - 台灣時間每天 7:00–22:00 每小時一次（#77；GitHub 排程可能延遲幾分鐘到十幾分鐘）；也可以在 Actions 頁選「同步試算表」→「Run workflow」手動跑
# - 資料有變才提交；讀取失敗時這次執行會顯示失敗，data/dogs.json 保留上一次成功的內容
# - 有人改了狗卡（dogs/*.md）或這支同步程式、推到 main 時也會馬上跑一次，狗卡資訊不用等排程
# - 另外存當天快照 data/history/YYYY-MM-DD.json 和累積遛狗紀錄 data/walks.json（#56，都不含志工名字）
# - 只讀試算表，不寫入試算表
# - 試算表 ID 放在 repo 的 Actions Secret「SHEET_ID」，不寫在程式裡（設定方式見 docs/SHEET_SYNC_SETUP.md）
name: 同步試算表

on:
  schedule:
    # cron 用 UTC：台灣 7:00–22:00 ＝ UTC 前一天 23:00 與 0:00–14:00
    - cron: '0 23,0-14 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dogs/**'
      - 'scripts/sync-sheet.mjs'

permissions:
  contents: write

# 同一時間只跑一次，避免兩次同步同時推送
concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 讀取試算表與狗卡、產生 data/dogs.json、當天快照與遛狗紀錄
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # 判斷「是不是我遛的」用的名字（#57）；沒設定也能同步，只是 myWalked 都是 false
          MY_NAME: ${{ secrets.MY_NAME }}
          # 把「誰遛的」名字換成代號用的密鑰（#94），要跟 Cloudflare Worker 的 WALKER_KEY 一樣；沒設定也能同步，只是沒有代號
          WALKER_KEY: ${{ secrets.WALKER_KEY }}
        run: node scripts/sync-sheet.mjs

      - name: 資料有變才提交
        run: |
          git add data/dogs.json data/history data/walks.json
          if git diff --cached --quiet; then
            echo "資料沒有變動，不提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步試算表：更新 data/dogs.json、當天快照與遛狗紀錄"
          # 期間有人推了別的提交就先接上再推，最多試三次
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
