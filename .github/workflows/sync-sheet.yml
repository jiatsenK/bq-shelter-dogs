# 定期把 Google 試算表同步進 D1（#31、#251）
# - 由 Cloudflare Worker 叫（ADR 0012，worker/src/sync-plan.js）：試算表有人手動改才叫（一天最多 12 次，#329）、台灣 6:30 保險一次、
#   按「更新」且試算表有變時叫。GitHub 自己的排程拿掉了（#305，省 Actions 分鐘數）；也可以在 Actions 頁選「同步試算表」→「Run workflow」手動跑
# - 溜狗紀錄只讀、只寫最近一段（ADR 0010）；6:30 保險同步另外核對每隻狗最後一次；手動跑時可勾「全量核對」讀整張
# - 只寫 D1（#251），而且只寫有變的列（差異同步，#302）：試算表沒變就不寫資料（換日後第一次同步會多寫 1 列同步日期，ADR 0010）；溜狗紀錄和離所以 D1 上一次的內容為基準往上加
# - 寫入預算（ADR 0008）：這次要寫的列數超過單次門檻、或今天整個帳號的 D1 寫入量會超過預算，就整次不寫、讓這次執行失敗，原因寫在執行頁的摘要
# - 不提交 GitHub、不寫 data/；讀取失敗或比對不一致時這次執行會顯示失敗，D1 保留上一次的內容
# - 同步程式改了、推到 main 時也會馬上跑一次；PR 階段由 tests.yml 的「同步預演」步驟用正式資料預演（#309、#329），兩邊的清單要一起改
# - 只讀試算表，不寫入試算表
# - 試算表 ID 放在 repo 的 Actions Secret「SHEET_ID」，不寫在程式裡（設定方式見 docs/setup/SHEET_SYNC_SETUP.md）
name: 同步試算表

on:
  workflow_dispatch:
    inputs:
      # ADR 0010：平常只比對最近一段溜狗紀錄，勾了才讀整張表比對
      full:
        description: '全量核對：讀整張溜狗紀錄比對（平常不用勾）'
        type: boolean
        default: false
      # Worker 在台灣 6:30 叫的保險同步會勾這個：再用主鍵核對每隻狗最後一次溜狗，有缺就補
      daily:
        description: '6:30 保險同步（Worker 自動帶，手動不用勾）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/sync-sheet.mjs'
      - 'scripts/sync-compact-d1.mjs'
      - 'scripts/sync-compact-plan.mjs'
      - 'scripts/sync-diff.mjs'
      - 'scripts/memory-d1.mjs'
      - 'scripts/import-compact-dogs.mjs'
      - 'scripts/import-compact-profiles.mjs'
      - 'scripts/import-compact-departures.mjs'
      - 'scripts/migrate-compact-db.mjs'
      - 'worker/src/compact.js'
      - 'db/compact-schema.sql'

permissions:
  contents: read

# 同一時間只跑一次，避免兩次同步同時寫 D1
concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 用部署同一組 Cloudflare Secrets（CLOUDFLARE_API_TOKEN 要有 D1 編輯權限）
      - name: 讀試算表、寫入 D1
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          # 判斷「是不是我遛的」用的名字（#57）；沒設定也能同步，只是 myWalked 都是 false
          MY_NAME: ${{ secrets.MY_NAME }}
          # 把「誰遛的」名字換成代號用的密鑰（#94），要跟 Cloudflare Worker 的 WALKER_KEY 一樣；沒設定也能同步，只是沒有代號
          WALKER_KEY: ${{ secrets.WALKER_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 寫入預算門檻（ADR 0008），沒設定就用程式裡的預設（單次 500 列、每天 2 萬列）；在 Actions 的 Variables 調整
          SYNC_MAX_ROWS: ${{ vars.SYNC_MAX_ROWS }}
          SYNC_DAILY_BUDGET: ${{ vars.SYNC_DAILY_BUDGET }}
          # 溜狗紀錄讀多少（ADR 0010）：full 整張、daily 最近一段＋每隻狗最後一次、空的只讀最近一段
          SYNC_MODE: ${{ inputs.full && 'full' || inputs.daily && 'daily' || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "沒有設定 CLOUDFLARE_API_TOKEN，無法寫入 D1。"; exit 1; fi
          node scripts/sync-compact-d1.mjs

      # 同步寫完 D1，打一次正式站讀取 API；缺表或讀不到就讓這次同步變紅叉（#293 回顧）
      - name: 檢查正式站 API
        run: node scripts/smoke-api.mjs
