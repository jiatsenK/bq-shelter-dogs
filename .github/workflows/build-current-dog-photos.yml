name: Build current dog photos

on:
  push:
    branches:
      - add-current-dog-photos-20260924
    paths:
      - tools/photo_manifest_ready

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python tools/build_current_dog_photos.py
      - name: Commit generated photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos
          git commit -m "Add current dog photos" || exit 0
          git push
