# 部署管理網站 bq-shelter-dogs-admin（ADR 0020，設定 wrangler.admin.jsonc）
# - 只能手動跑：Actions 頁選「部署管理網站」→「Run workflow」。管理網站直接寫正式 D1／R2，所以 main 推送不會自動部署（K 2026-10-26）
# - #622：只部署 main，不能填分支；選別的分支整個略過。要先試某張 PR 用測試網站或預覽
# - 部署紀錄的 Message 寫「main commit」，從 Cloudflare 部署紀錄就看得出線上是哪一版
# - 正式 D1 有還沒套的 migration 就停（跟「部署到 Cloudflare」同一行檢查），先去按「套用 D1 migration」
# - 不帶金鑰：管理網站沒有密鑰。ACCESS_TEAM_DOMAIN、ACCESS_AUD 在 wrangler.admin.jsonc；
#   ADMIN_ORIGIN 含帳號子網域，部署時用 --var 從 GitHub Secret WORKERS_SUBDOMAIN 組出來（#493，日誌裡子網域顯示成 ***）
# - 網站連結頁的四個網址也用 --var 帶上（repo 公開，不寫在檔案裡）：正式／測試網站由 WORKERS_SUBDOMAIN 組出；
#   GAS 連結是 GitHub Secret GAS_URL、TEST_GAS_URL，沒設就不帶，頁面寫「還沒設定」
# - 部署完沒登入打一次首頁，要被轉到 Access 登入頁；沒被擋就紅叉
# - 改到兩站共用的程式（worker/src/ 共用模組、public/js/ 共用檔）時，志工網站由 main 推送自動部署，管理網站要另外按這裡
name: 部署管理網站

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    # #622：只准 main，從別的分支按會整個略過（灰色），不碰正式環境
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
      ADMIN_ORIGIN: https://bq-shelter-dogs-admin.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev
      SITE_URL: https://bq-shelter-dogs.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev
      TEST_SITE_URL: https://bq-shelter-dogs-test.${{ secrets.WORKERS_SUBDOMAIN }}.workers.dev
      SHEET_URL: ${{ secrets.SHEET_URL }}
      TEST_SHEET_URL: ${{ secrets.TEST_SHEET_URL }}
      GAS_URL: ${{ secrets.GAS_URL }}
      TEST_GAS_URL: ${{ secrets.TEST_GAS_URL }}
    steps:
      - name: 沒設定 Cloudflare 就停
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.WORKERS_SUBDOMAIN == ''
        run: |
          echo "還沒在 GitHub 設 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID、WORKERS_SUBDOMAIN（步驟見 docs/setup/CLOUDFLARE_SETUP.md）。"
          exit 1

      # 系統架構圖頁的「第幾版、哪天更新」從 git 歷史數，只抓 1 個 commit 會全部變成第 1 版（scripts/admin-diagrams.mjs）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 系統架構圖頁：建置（wrangler.admin.jsonc 的 build）用無頭瀏覽器把 docs/ARCHITECTURE.md 的 Mermaid 畫成 SVG（scripts/admin-diagrams.mjs）。
      # 安裝方式同 tests.yml；裝不起來不擋部署，頁面改顯示「到 GitHub 看圖」，Actions 摘要會有黃色警告
      - name: 安裝無頭瀏覽器（畫架構圖用）
        timeout-minutes: 5
        run: timeout -k 10 240 bash -c 'npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps --only-shell chromium' || echo '::warning::無頭瀏覽器沒裝起來，架構圖頁這次改顯示 GitHub 連結'

      - name: 確認正式庫 migration 都套過
        run: node scripts/d1-migrations.mjs check --target production

      - name: 部署
        env:
          REF: ${{ github.ref_name }}
        run: |
          sha=$(git rev-parse --short HEAD)
          echo "部署管理網站：${REF} ${sha}"
          links=(--var "SITE_URL:${SITE_URL}" --var "TEST_SITE_URL:${TEST_SITE_URL}")
          if [ -n "$SHEET_URL" ]; then links+=(--var "SHEET_URL:${SHEET_URL}"); fi
          if [ -n "$TEST_SHEET_URL" ]; then links+=(--var "TEST_SHEET_URL:${TEST_SHEET_URL}"); fi
          if [ -n "$GAS_URL" ]; then links+=(--var "GAS_URL:${GAS_URL}"); fi
          if [ -n "$TEST_GAS_URL" ]; then links+=(--var "TEST_GAS_URL:${TEST_GAS_URL}"); fi
          npx --yes wrangler@4 deploy --config wrangler.admin.jsonc --message "${REF} ${sha}" --var "ADMIN_ORIGIN:${ADMIN_ORIGIN}" "${links[@]}"

      - name: 確認沒登入會被 Access 擋
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$ADMIN_ORIGIN/")
          echo "$ADMIN_ORIGIN/ → $code"
          case "$code" in
            "302 https://"*.cloudflareaccess.com/cdn-cgi/access/login/*) ;;
            *) echo "沒被轉到 Access 登入頁，檢查 Cloudflare Access 設定"; exit 1 ;;
          esac
