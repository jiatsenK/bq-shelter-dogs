# 把網站＋API 部署到 Cloudflare（#125，設定在 repo 根目錄的 wrangler.jsonc）
# - main 有推送、而且改到網站或 Worker 的檔案才部署（#329 起，見下方 paths）；網站上傳的照片存 R2，不用重新部署
# - 縮圖（#130 起存 R2）、同步試算表（#251 起只寫 D1）都不提交，跑完不用重新部署（#305 拿掉縮圖後部署）
# - 還沒在 GitHub 設 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID 時直接跳過，不會失敗；設定步驟見 docs/setup/CLOUDFLARE_SETUP.md
# - Worker 要用的密碼也從 GitHub Secret 一起帶上去（有設才帶，沒設的保留 Cloudflare 上原本的）：
#   ADMIN_KEY（給 /api/admin 的 GitHub Action）、WALKER_KEY（登記名字換代號）、SHEET_WRITE_URL、SHEET_WRITE_KEY（寫回試算表）
# - #595：MY_NAME、SHEET_ID 不再帶（Worker 沒在讀），NOTES_PASSCODE 備援拿掉；Cloudflare 上已有的要另外刪
# - 也可以在 Actions 頁選「部署到 Cloudflare」→「Run workflow」手動跑
# - #553：正式 D1 有還沒套的 migration（migrations/）就停下、紅叉，不部署；去按「套用 D1 migration」，它套完會呼叫這裡部署
# - #622：只准 main（手動選別的分支、從別的分支呼叫都略過）；部署排隊不取消，見下方 concurrency
name: 部署到 Cloudflare

on:
  workflow_dispatch:
  # 「套用 D1 migration」（d1-migrations.yml）套完後呼叫
  workflow_call:
  push:
    branches: [main]
    # 只有會放上網站的檔案改了才部署（#329，省 Actions 分鐘數）：文件、測試、同步程式、版本號都不用重新部署
    paths:
      - 'public/**'
      - 'worker/src/**'
      - 'wrangler.jsonc'
      - 'scripts/analytics-beacon.mjs'
      - 'scripts/r2-bucket.mjs'
      - 'scripts/d1-database.mjs'
      - 'scripts/smoke-api.mjs'
      - '.github/workflows/deploy-cloudflare.yml'
      # #553：合併新的 migration 也跑一次，沒套就紅叉提醒
      - 'migrations/**'
      - 'scripts/d1-migrations.mjs'

permissions:
  contents: read

# #622：排隊不取消。正在跑的部署跑完才換下一個；還在排隊的會被更新的那次換掉（用更新的 main，一樣先確認 migration）。
# 原本 cancel-in-progress: true 會把「套用 D1 migration」套完後呼叫的部署砍掉（2026-10-25 run 40193463576），
# 接手那次若失敗，正式站會停在「D1 新結構＋舊程式」
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # #622：只准 main，從別的分支按會整個略過（灰色），不碰正式環境
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # #493：帳號的 workers.dev 子網域放 GitHub Secret；有用到 Secret 的 job，日誌裡出現的子網域一律顯示成 ***（wrangler 印的網址也是）
      WORKERS_SUBDOMAIN: ${{ secrets.WORKERS_SUBDOMAIN }}
    steps:
      - name: 還沒設定 Cloudflare 就跳過
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "還沒在 GitHub 設 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，這次不部署（步驟見 docs/setup/CLOUDFLARE_SETUP.md）。"

      # #493：沒設子網域就停，免得 wrangler 把正式網址原樣印進公開日誌
      - name: 沒設 WORKERS_SUBDOMAIN 就停
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.WORKERS_SUBDOMAIN == ''
        run: |
          echo "還沒在 GitHub 設 WORKERS_SUBDOMAIN（帳號的 workers.dev 子網域，步驟見 docs/setup/CLOUDFLARE_SETUP.md）。"
          exit 1

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22

      # 瀏覽統計（#128）：只有正式網站插 Cloudflare Web Analytics 的 beacon，不提交；沒設 CF_ANALYTICS_TOKEN 就跳過
      - name: 瀏覽統計
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: node scripts/analytics-beacon.mjs public

      # #214：只查既有 R2，失敗停止，不建立或拿掉綁定
      - name: 確認照片空間（R2）
        id: r2
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/r2-bucket.mjs

      # #214：正式 D1 只驗證 ID 與唯讀查詢；不建庫、不建表、不匯入
      - name: 準備資料庫（D1）
        id: d1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/d1-database.mjs --config "${{ steps.r2.outputs.config }}"

      # #553：只送 SELECT 比對 d1_migrations 與 migrations/；有還沒套的就停，提示按「套用 D1 migration」
      - name: 確認正式庫 migration 都套過
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/d1-migrations.mjs check --target production

      - name: 部署
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WALKER_KEY: ${{ secrets.WALKER_KEY }}
          SHEET_WRITE_URL: ${{ secrets.SHEET_WRITE_URL }}
          SHEET_WRITE_KEY: ${{ secrets.SHEET_WRITE_KEY }}
        run: |
          # 密碼寫進暫存檔交給 wrangler，不印出來；沒設的不放（不會蓋掉 Cloudflare 上原本的）
          node -e '
            const s = { ADMIN_KEY: process.env.ADMIN_KEY, WALKER_KEY: process.env.WALKER_KEY, SHEET_WRITE_URL: process.env.SHEET_WRITE_URL, SHEET_WRITE_KEY: process.env.SHEET_WRITE_KEY };
            for (const k of Object.keys(s)) if (!s[k]) delete s[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(s), { mode: 0o600 });
            console.log("帶上去的密碼：" + (Object.keys(s).join("、") || "沒有"));
          ' "$RUNNER_TEMP/worker-secrets.json"
          npx --yes wrangler@4 deploy --config "${{ steps.d1.outputs.config }}" --secrets-file "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      # 部署完打一次正式站讀取 API：正式 D1 缺表、密碼沒設這類 CI 測不到的問題在這裡變紅叉（#293 回顧）
      - name: 檢查正式站 API
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/smoke-api.mjs "https://bq-shelter-dogs.${WORKERS_SUBDOMAIN}.workers.dev"
