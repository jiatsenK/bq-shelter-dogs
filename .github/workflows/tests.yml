# 自動跑測試（#84）：開 PR 時跑，PR 上會顯示綠勾或紅叉
# - #329 起推到 main 不再跑：合併前 PR 已經跑過同一份程式，省 Actions 分鐘數；要重跑就在 Actions 頁手動按 Run workflow
# - node 測試：scripts/run-node-tests.mjs 跑 scripts/、worker/ 底下全部 *.test.mjs
# - 網頁測試：用無頭瀏覽器打開 tests/index.html（scripts/run-browser-tests.cjs），全部通過才算過
# - 測試本身只讀 repo 裡的檔案和假資料，不碰試算表、Worker 或任何密鑰
# - 草稿 PR 不跑（#329）：agent 先開草稿，推完最後一次再轉正式（gh pr ready），轉正式時才跑一次
# - 同步預演（#309）併在這裡（#329，省一個 job 的進位分鐘）：PR 改到同步程式才跑，用正式試算表和正式 D1 算「會寫幾列」，不寫入，結果留言在 PR
#   K 看留言的 N：個位數到幾十可以合併；幾百、幾千或出錯就不要合併。同步程式的清單跟 sync-sheet.yml 的 push paths 要一起改
name: 測試

# 只改文件（docs/、根目錄的 .md）不跑（#305）。repo 沒有設必要檢查（私人 repo 免費方案不能設），跳過不會卡住 PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# 同一個 PR 推了新的提交，就取消舊的那次
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 自動找 scripts/、worker/ 底下全部 *.test.mjs，新增測試不用改這裡
      - name: node 測試
        run: node scripts/run-node-tests.mjs

      - name: 安裝無頭瀏覽器
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: 網頁測試（tests/index.html）
        run: node scripts/run-browser-tests.cjs

      # ↓ 同步預演：只有 PR 改到同步程式才跑；fork 的 PR 拿不到密鑰，跳過
      - name: 有沒有改到同步程式
        id: sync
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')
          if echo "$files" | grep -qxE 'scripts/(sync-sheet|sync-compact-d1|sync-plan|sync-diff|import-compact-dogs|import-compact-profiles|import-compact-departures|migrate-compact-db)\.mjs|worker/src/compact\.js|db/compact-schema\.sql|\.github/workflows/tests\.yml'; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步預演：用正式資料算會寫幾列（不寫入）
        if: steps.sync.outputs.run == '1'
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          MY_NAME: ${{ secrets.MY_NAME }}
          WALKER_KEY: ${{ secrets.WALKER_KEY }}
          # 用正式同步同一把 token（Cloudflare 查 D1 也要寫入權限）；程式在預演時只准送 SELECT，寫入指令會被擋下
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN_COMMENT: ${{ runner.temp }}/dry-run.md
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "## 預演失敗：沒有設定 CLOUDFLARE_API_TOKEN" | tee "$DRY_RUN_COMMENT"; exit 1; fi
          node scripts/sync-compact-d1.mjs --dry-run

      # 預演成功、失敗都留言（測試失敗而沒跑到預演時不留）；PR 每推一次就多一則，K 看最新那則
      - name: 同步預演：留言在 PR 上
        if: always() && steps.sync.outputs.run == '1' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ runner.temp }}/dry-run.md
        run: |
          [ -s "$FILE" ] || echo "## 預演失敗：沒有產生結果（可能是前面的測試沒過），請看執行頁的紀錄" > "$FILE"
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$FILE"
