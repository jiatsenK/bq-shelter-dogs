# 自動跑測試（#84）：開 PR 時跑，PR 上會顯示綠勾或紅叉
# - #329 起推到 main 不再跑：合併前 PR 已經跑過同一份程式，省 Actions 分鐘數；要重跑就在 Actions 頁手動按 Run workflow
# - node 測試：scripts/run-node-tests.mjs 跑 scripts/、worker/ 底下全部 *.test.mjs
# - 網頁測試：用無頭瀏覽器打開 tests/index.html（scripts/run-browser-tests.cjs），全部通過才算過
# - 測試本身只讀 repo 裡的檔案和假資料，不碰試算表、Worker 或任何密鑰
# - 草稿 PR 不跑（#329）：agent 先開草稿，推完最後一次再轉正式（gh pr ready），轉正式時才跑一次
# - 同步預演（#309、#329）#501 起拿掉：試算表同步不再由 Actions 執行，狗清單改由 GAS 編輯觸發送 Worker
# - 卡住要變「失敗」不是「取消」（#659、#713）：取消的 run 在 PR 上不顯眼，容易被當成沒問題合併。
#   安裝和網頁測試各自設時限，job 的時限放寬到只當最後防線；網頁測試每個套件另有 150 秒時限（scripts/suite-timeout.cjs）
name: 測試

# 只改文件（docs/、根目錄的 .md）不跑（#305）。repo 沒有設必要檢查（私人 repo 免費方案不能設），跳過不會卡住 PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# 同一個 PR 推了新的提交，就取消舊的那次
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 自動找 scripts/、worker/ 底下全部 *.test.mjs，新增測試不用改這裡
      - name: node 測試
        run: node scripts/run-node-tests.mjs

      # 平常約 30 秒；偶爾 apt 下載字型等系統套件卡住 10 分鐘（#659），每次最多 4 分鐘、卡住重試一次
      # --only-shell：無頭模式本來就只用 chromium-headless-shell，不下載用不到的完整版 Chromium（#503 方案 4）
      - name: 安裝無頭瀏覽器
        timeout-minutes: 9
        run: |
          for attempt in 1 2; do
            if timeout -k 10 240 bash -c 'npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps --only-shell chromium'; then
              exit 0
            fi
            echo "::warning::安裝無頭瀏覽器第 ${attempt} 次失敗或超過 4 分鐘"
            sudo dpkg --configure -a || true # 中斷在 apt 安裝途中時，重試前先收拾 dpkg
          done
          exit 1

      # 平常約 1.5 分鐘
      - name: 網頁測試（tests/index.html）
        timeout-minutes: 5
        run: node scripts/run-browser-tests.cjs
